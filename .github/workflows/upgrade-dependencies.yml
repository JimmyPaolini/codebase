name: 🧑‍🚒 Upgrade Dependencies

on:
  schedule:
    - cron: 18 8 * * 5
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  upgrade-dependencies:
    name: 🧑‍🚒 Upgrade Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: 🕋 Setup Codebase
        uses: ./.github/actions/setup-codebase
        with:
          nx-shas: "false"

      - name: 🎁 Upgrade pnpm
        run: |
          jq --arg v "pnpm@$(pnpm view pnpm version)" '.packageManager = $v' package.json > package.json.temporary && mv package.json.temporary package.json

      - name: 🟢 Upgrade node
        run: |
          source ~/.nvm/nvm.sh
          LATEST_NODE=$(nvm version-remote lts/* | sed 's/v//')
          echo "v${LATEST_NODE}" > .nvmrc
          jq --arg v ">=${LATEST_NODE}" '.engines.node = $v' package.json > package.json.temporary && mv package.json.temporary package.json

      - name: 🐍 Upgrade Python
        run: |
          uv python install 3 --upgrade
          LATEST_PYTHON=$(uv run --python 3 python -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')")
          PYTHON_VER=$(echo "$LATEST_PYTHON" | tr -d '.')
          sed -i "s/requires-python = \">=3\.[0-9][0-9]*/requires-python = \">=${LATEST_PYTHON}/" pyproject.toml
          sed -i "s/target-version = \"py[0-9][0-9]*/target-version = \"py${PYTHON_VER}/" pyproject.toml
          sed -i "s/pythonVersion = \"3\.[0-9][0-9]*/pythonVersion = \"${LATEST_PYTHON}/" pyproject.toml
          sed -i "s/requires-python = \">=3\.[0-9][0-9]*/requires-python = \">=${LATEST_PYTHON}/" applications/affirmations/pyproject.toml

      # `pnpm update --latest --recursive "!typescript"` then `pnpm dedupe`,
      # via the Nx target rather than as bare `pnpm` lines here, so that a
      # human upgrading locally gets the same two commands with the same hold.
      #
      # The hold on typescript is what unblocked this workflow. typescript 7
      # is the native compiler: its package entrypoint exports a version
      # string and nothing else, so the whole JavaScript compiler API is gone.
      # Everything that reads that API breaks the moment `--latest` crosses
      # that major — nx, typescript-eslint, knip, type-coverage,
      # @swc-node/register — and nx breaks first and loudest, failing every
      # invocation with `tsModule.readConfigFile is not a function` while
      # registering the transpiler for workspace plugins. Crossing a major
      # that large is a deliberate migration, never a weekly bump. The
      # `check` configuration still reports typescript as outdated, so the
      # hold stays visible rather than becoming a silent pin.
      #
      # The dedupe is what makes this workflow reach transitive dependencies
      # at all. `--latest` moves direct and catalog entries; a transitive
      # entry that already satisfies its parents' ranges stays pinned in the
      # lockfile, which is how a vulnerable transitive copy survives an
      # upgrade that reports success. Observed while resolving 17 Dependabot
      # alerts: `pnpm install` said `Already up to date` while `pnpm dedupe`
      # moved 8 packages and dropped 10.
      - name: 📦 Upgrade Dependencies
        run: pnpm exec nx run codebase:upgrade-dependencies:write

      # The cheapest thing that proves the upgrade did not break Nx itself.
      # Loading the project graph loads every workspace plugin, which is the
      # step that died for 13 weeks — and it died inside the husky pre-commit
      # hook of `🔀 Open Pull Request`, reported as `Unexpected error:
      # pre-commit` five steps after the upgrade that caused it. Failing here
      # names the upgrade as the cause while the diff is still on disk.
      #
      # No `--configuration=check` lint gate here: the commit below fires
      # pre-commit, which runs the whole gate already. This only has to catch
      # a toolchain that cannot start.
      - name: 🩺 Verify Toolchain
        run: pnpm exec nx show projects

      - name: 📦 Upgrade Python Dependencies
        # One lockfile covers every uv workspace member.
        run: uv lock --upgrade

      - name: 🤹 Upgrade Skills
        run: pnpm exec skills update --yes

      - name: 🔍 Detect Upgrades
        id: check
        run: |
          if git diff --quiet; then
            echo "has_dependency_updates=false" >> $GITHUB_OUTPUT
          else
            echo "has_dependency_updates=true" >> $GITHUB_OUTPUT
          fi

      - name: 🔐 Import GPG Key
        if: steps.check.outputs.has_dependency_updates == 'true'
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: 🔀 Open Pull Request
        if: steps.check.outputs.has_dependency_updates == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(dependencies): ⬆️ Upgrade"
          branch: chore/dependencies-upgrade
          delete-branch: true
          title: "chore(dependencies): ⬆️ Upgrade"
          body: |
            ## 🌰 Summary

            Automated dependency updates detected by the weekly dependency check.

            ## 📝 Details

            - Update node to latest patch of current major
            - Update pnpm to latest version
            - Update dependencies across all workspace projects,
              holding typescript back
            - Deduplicate the lockfile so in-range transitive upgrades land
            - Update pnpm lockfile
            - Update Python to latest stable 3.x
            - Update Python dependencies across all projects
            - Update vendored skills from their upstream sources

            ## 🧪 Testing

            1. Review changes in the diff
            2. Verify all code checks pass
            3. Test functionality manually (if needed)

            ## 🔗 Related

            - *Generated by [🧑‍🚒 Upgrade Dependencies](${{ format(
              'https://github.com/{0}/actions/workflows/upgrade-dependencies.yml',
              github.repository) }})*
          # The type:, scope:, and source: labels and the assignee are what
          # 🧑‍⚖️ Validate Conventions requires of every pull request, this
          # one included. The type and scope mirror the title above.
          labels: |
            dependencies
            automated
            type:chore
            scope:dependencies
            source:agent
          assignees: JimmyPaolini

  # 13 consecutive weekly failures went unnoticed, because a scheduled run
  # that fails notifies nobody — there is no pull request to turn red and no
  # author to email. This job is the notification: one open issue that every
  # subsequent failure comments on, so the count is visible on the issue
  # rather than only in the run history.
  report-failure:
    name: 🚨 Report Failure
    needs: upgrade-dependencies
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Narrower than the workflow default: this job reads and writes issues
    # and touches neither the repository contents nor a pull request.
    permissions:
      issues: write

    steps:
      # The existing report is found by listing the label combination this
      # job itself applies and matching the title exactly, rather than by
      # `--search "in:title ..."`. Search tokenizes, and a phrase that fails
      # to match would open a second issue every week — the very noise this
      # job exists to avoid.
      - name: 🚨 Open or Update the Failure Issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ format(
            'https://github.com/{0}/actions/runs/{1}',
            github.repository, github.run_id) }}
          WORKFLOW_URL: ${{ format(
            'https://github.com/{0}/actions/workflows/upgrade-dependencies.yml',
            github.repository) }}
        run: |
          export SUBJECT="the weekly dependency upgrade is failing"
          EXISTING=$(gh issue list --state open --limit 100 \
            --label automated --label type:ci --label scope:deployments \
            --json number,title \
            --jq '[.[] | select(.title | endswith(env.SUBJECT))]
                  | .[0].number // empty')

          if [[ -n "$EXISTING" ]]; then
            gh issue comment "$EXISTING" \
              --body "Failed again: [this run](${RUN_URL})."
            echo "Commented on #${EXISTING}."
            exit 0
          fi

          cat > .failure-issue-body.md <<BODY
          ## Description

          The weekly [\`🧑‍🚒 Upgrade Dependencies\`](${WORKFLOW_URL})
          workflow failed, so no dependency pull request was opened. Nothing
          else surfaces this: a scheduled run has no pull request to turn red
          and no author to email.

          Every later failure comments here rather than opening another issue,
          so the comment count is how long this has been broken.

          ## Steps to Reproduce

          1. Open [the failing run](${RUN_URL}).
          2. Read the first red step.

          ## Expected Behavior

          The run opens or updates the \`chore/dependencies-upgrade\` pull
          request whenever it detects upgrades.

          ## Actual Behavior

          The run failed. See [its logs](${RUN_URL}).

          ## Related

          - [🧑‍🚒 Upgrade Dependencies](${WORKFLOW_URL})
          BODY

          gh issue create \
            --title "ci(deployments): 🧑‍🚒 ${SUBJECT}" \
            --body-file .failure-issue-body.md \
            --label automated \
            --label type:ci \
            --label scope:deployments \
            --label source:agent \
            --label status:needs-triage \
            --assignee JimmyPaolini
