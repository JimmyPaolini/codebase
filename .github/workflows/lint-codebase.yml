name: 🧑‍💻 Lint Codebase

# Static code analysis: every check that reads the source without executing it.
# One `nx affected` invocation builds one task graph and one scheduler runs it.
# This replaced `analyze-code`, whose composite targets spawned a nested `nx
# run` per tool — 290 project graph builds for one logical command.

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      verbose:
        description: Enable verbose Nx logging
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-codebase:
    name: 🧑‍💻 Lint Codebase
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🕋 Setup Codebase
        uses: ./.github/actions/setup-codebase

      # `callidescope` and each derivation synchronization are named alongside
      # `lint-codebase` rather than hanging off its `dependsOn`, because
      # callidescope also publishes a report on the default branch and Nx
      # forwards an explicit configuration down `dependsOn` — reachable from
      # `lint-codebase`, it would take `write` from
      # `lint-codebase --configuration=write` and publish its report from a
      # branch. Naming them here is what keeps their gates on every pull
      # request: depth for callidescope, derivation drift for each
      # synchronization, neither of which writes a file. There is no aggregate
      # `synchronize` target: each synchronization is its own Nx target on the
      # `synchronization` project, named here the same way `codometer` and
      # `callidescope` are named by their own callers. They join the same
      # `nx affected` invocation rather than taking steps of their own, so one
      # task graph and one scheduler still own the whole run, and `affected`
      # still decides whether any of them has anything to look at.
      - name: 🧑‍💻 Lint Codebase
        env:
          NX_VERBOSE_LOGGING: ${{ inputs.verbose || false }}
        run: |
          pnpm exec nx affected --target=lint-codebase \
            --target=callidescope \
            --target=conformetry-generators --target=conventional-config \
            --target=devcontainer-configuration \
            --target=pull-request-template --target=skill-exclusions \
            --configuration=check --parallel=4

      - name: 📊 Upload Type Coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: type-coverage-reports
          path: |
            applications/**/type-coverage-report.txt
            packages/**/type-coverage-report.txt
            tools/**/type-coverage-report.txt
          retention-days: 30
