name: 🧑‍💻 Lint Codebase

# Static code analysis: every check that reads the source without executing it.
# One `nx affected` invocation builds one task graph and one scheduler runs it.
# This replaced `analyze-code`, whose composite targets spawned a nested `nx
# run` per tool — 290 project graph builds for one logical command.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      verbose:
        description: Enable verbose Nx logging
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-codebase:
    name: 🧑‍💻 Lint Codebase
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🕋 Setup Codebase
        uses: ./.github/actions/setup-codebase

      - name: 🧑‍💻 Lint Codebase
        env:
          NX_VERBOSE_LOGGING: ${{ inputs.verbose || false }}
        run: |
          pnpm exec nx affected --target=lint-codebase \
            --configuration=check --parallel=4

      # `lint-codebase` depends on this too, so a full or `run-many` invocation
      # covers it — which is what makes the local command equivalent to this
      # workflow. It stays an explicit step because `nx affected` maps a touched
      # file to the project whose root is the longest matching prefix, so a
      # change under `packages/` never marks the root `codebase` project
      # affected, and the dependency alone would sit idle on exactly the pull
      # requests worth checking. When the step above already ran it, this hits
      # the cache.
      - name: 🔭 Lint Call Stacks
        run: pnpm exec nx run codebase:callidescope:check

      - name: 📊 Upload Type Coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: type-coverage-reports
          path: |
            applications/**/type-coverage-report.txt
            packages/**/type-coverage-report.txt
            tools/**/type-coverage-report.txt
          retention-days: 30
