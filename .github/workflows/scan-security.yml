name: 🕵️ Scan Security

# Secrets, Python AST, dependency vulnerabilities, licenses, and infrastructure
# misconfiguration — all as Nx targets, so `nx run codebase:scan-security`
# reproduces this job locally.

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  schedule:
    - cron: 0 6 * * 1 # Weekly Monday 6am UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Per-commit on `main`, per-ref everywhere else. This workflow's README badge
  # renders every non-`success` conclusion red, `cancelled` among them, so a
  # merge landing while the previous one is still running leaves the badge
  # reporting a run that was superseded rather than one that broke. Roughly a
  # quarter of merges land inside a run window, and the badge stays red until
  # the next merge clears it.
  #
  # `cancel-in-progress: false` alone would not fix that, which is the trap:
  # GitHub keeps at most one *pending* run per group, so a third push cancels
  # the queued second one whatever this flag says. Only a group nothing else
  # can join keeps a `main` run out of that queue.
  #
  # Pull request branches keep cancelling, where no badge reads the conclusion
  # and a superseded run is pure waste.
  group: >-
    ${{ github.workflow }}-${{ github.ref == 'refs/heads/main'
    && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  scan-security:
    name: 🕵️ Scan Security
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🕋 Setup Codebase
        uses: ./.github/actions/setup-codebase
        with:
          gitleaks: "true"
          trivy: "true"

      # `pnpm-audit:check` passes `--ignore-registry-errors`, which exits 0
      # when the advisory fetch itself throws. npm's
      # `/-/npm/v1/security/advisories/bulk` endpoint accepts the POST and
      # then never answers during an incident — ordinary registry reads stay
      # fast, so nothing else in the job notices — and pnpm's three retries
      # turn that into a three-minute red build on every push and pull
      # request. Scan Security is a required check, so an npm outage blocked
      # every merge in the repository.
      #
      # The flag is narrower than it sounds: pnpm wraps only the advisory
      # fetch in the try/catch it short-circuits, so a registry that answers
      # with vulnerabilities still fails this step. Only an unreachable
      # registry passes, and the warnings it printed stay in the log. The
      # weekly schedule re-audits once npm recovers.
      #
      # Terraform scanning used to sit behind a `dorny/paths-filter` step with
      # a special case for schedule events, which have no diff context. The
      # trivy-config target declares the terraform tree in its `inputs`, so Nx
      # skips it on a cache hit — the same saving without the special case.
      - name: 🕵️ Scan Security
        run: pnpm exec nx affected --target=scan-security --parallel=4

      # gitleaks scans history, so it belongs to the root project rather than
      # to whichever project a commit happened to touch, and `affected` will
      # not select it on most pull requests.
      #
      # A full-history scan walks every commit the repository has ever had,
      # which is unnecessary on every push and pull request when the weekly
      # schedule (and workflow_dispatch, for an on-demand audit) already cover
      # that ground. Push, pull_request, and merge_group events scan only the
      # commits being introduced (NX_BASE..NX_HEAD) instead, which is what
      # actually needs to gate before landing — nothing older can have
      # changed. merge_group is named explicitly because this is a required
      # check in the merge queue, and an event matching neither branch would
      # report a green secret scan having scanned nothing at all.
      - name: 🚰 Scan Secrets (Full History)
        if: |
          github.event_name == 'schedule'
          || github.event_name == 'workflow_dispatch'
        run: pnpm exec nx run codebase:gitleaks:ci

      - name: 🚰 Scan Secrets (Incremental)
        if: >-
          github.event_name == 'push'
          || github.event_name == 'pull_request'
          || github.event_name == 'merge_group'
        run: pnpm exec nx run codebase:gitleaks:ci-incremental
