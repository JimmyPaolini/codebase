name: 🧑‍🔬 Test Coverage

# Dynamic code analysis: the checks that execute the source.

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      verbose:
        description: Enable verbose Nx logging
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Per-commit on `main`, per-ref everywhere else. This workflow's README badge
  # renders every non-`success` conclusion red, `cancelled` among them, so a
  # merge landing while the previous one is still running leaves the badge
  # reporting a run that was superseded rather than one that broke. Roughly a
  # quarter of merges land inside a run window, and the badge stays red until
  # the next merge clears it.
  #
  # `cancel-in-progress: false` alone would not fix that, which is the trap:
  # GitHub keeps at most one *pending* run per group, so a third push cancels
  # the queued second one whatever this flag says. Only a group nothing else
  # can join keeps a `main` run out of that queue.
  #
  # Pull request branches keep cancelling, where no badge reads the conclusion
  # and a superseded run is pure waste.
  group: >-
    ${{ github.workflow }}-${{ github.ref == 'refs/heads/main'
    && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test-coverage:
    name: 🧑‍🔬 Test Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🕋 Setup Codebase
        uses: ./.github/actions/setup-codebase

      # `--configuration=coverage` is passed explicitly and must stay that way:
      # Nx propagates an explicit configuration down `dependsOn`, but never a
      # `defaultConfiguration`. Drop the flag and the leaves run without
      # coverage instrumentation or thresholds.
      - name: 🧪 Test Coverage
        env:
          NX_VERBOSE_LOGGING: ${{ inputs.verbose || false }}
        run: |
          pnpm exec nx affected --target=test-coverage \
            --configuration=coverage --parallel=4

      - name: 📊 Upload Test Coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            coverage/
            applications/**/coverage/
            packages/**/coverage/
            tools/**/coverage/
          retention-days: 30
