name: 👷 Make Projects

# Builds every workspace project and measures its bundle. The devcontainer
# image is built by its own workflow, gated on `.devcontainer/**` by
# GitHub's native `on.paths`.

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  make-projects:
    name: 👷 Make Projects
    runs-on: ubuntu-latest
    timeout-minutes: 12

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🕋 Setup Codebase
        uses: ./.github/actions/setup-codebase
        with:
          # Builds and bundle sizing touch no Python-backed tool.
          python-dependencies: "false"

      # A breached limit fails `codometer`, and the whole point of the report is
      # to say which bundle broke. So the failure is recorded here and re-raised
      # once the report is written, rather than ending the job while the
      # developer still has nothing to read. `codometer` writes each project's
      # report before it weighs any limit, so the breach that fails this step
      # has already left the numbers behind for the section below to render.
      #
      # Limits only: `codometer` is never asked to check report staleness here.
      # Project READMEs are written on main by the release workflow, so on a
      # branch they are expected to be behind and there is nothing to gate.
      - name: 👷 Make Projects
        id: make-projects
        continue-on-error: true
        run: pnpm exec nx affected --target=make-projects --parallel=4

      # There is one baseline, not a "previous" and a "merged" one: this step
      # downloads it, the next overlays this run's fresh reports directly onto
      # it in place, and the one after re-uploads that same directory. A pull
      # request run stops after this step and only ever reads it.
      #
      # Not dot-prefixed: `actions/upload-artifact` walks `path` with
      # `@actions/glob`, which excludes dotfiles and dot-directories unless
      # `include-hidden-files: true` is set. A dot-prefixed staging directory
      # was silently treated as entirely hidden, so every file placed inside it
      # was invisible to the upload step — the baseline artifact had been empty
      # since this report shipped, and every pull request compared against
      # nothing.
      - name: 📥 Download Codometer Baseline
        id: baseline
        if: >-
          (github.ref == 'refs/heads/main' && steps.make-projects.outcome == 'success')
          || github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_id="$(gh run list --workflow=make-projects.yml --branch=main \
            --status=success --limit=1 --json databaseId --jq '.[0].databaseId')"
          if [[ -z "${run_id}" ]]; then
            echo "No successful main run to compare against yet."
            exit 0
          fi
          gh run download "${run_id}" --name codometer-reports-main --dir codometer-baseline
          echo "run-url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
            >>"${GITHUB_OUTPUT}"

      # On main this snapshot becomes the baseline every later pull request
      # compares against, which is what removes the second checkout, install,
      # and full build this job used to run just to size the base branch. A
      # failed build would publish a partial baseline, so it is skipped.
      #
      # `nx affected` above only rebuilds what this push touched, so this run's
      # reports alone cover a fraction of the workspace. The baseline is kept
      # complete by overlaying today's fresh reports onto the one just
      # downloaded rather than replacing it outright — a project untouched by
      # this push keeps the size it last measured instead of disappearing from
      # the baseline and reading as new on the next pull request that compares
      # against it.
      - name: 🧺 Update Codometer Baseline
        if: >-
          github.ref == 'refs/heads/main'
          && steps.make-projects.outcome == 'success'
        run: |
          mkdir -p codometer-baseline
          shopt -s nullglob
          for report in applications/*/codometer-report.json \
            packages/*/codometer-report.json \
            tools/*/codometer-report.json; do
            mkdir -p "codometer-baseline/$(dirname "${report}")"
            cp "${report}" "codometer-baseline/${report}"
          done

      - name: 📤 Upload Codometer Baseline
        if: >-
          github.ref == 'refs/heads/main'
          && steps.make-projects.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: codometer-reports-main
          path: codometer-baseline
          retention-days: 90
          if-no-files-found: ignore

      # The report lives in the description, not a comment. Review automation
      # treats every new pull request comment as feedback needing a reply, so a
      # bot posting build statistics on each push kept waking agents up.
      #
      # The tool only ever touches a markdown file, so it stays independent of
      # any one forge's API. The description is fetched and put back around it.
      - name: ⏲️ Report Codometer Changes
        if: github.event_name == 'pull_request'
        env:
          BASELINE_URL: ${{ steps.baseline.outputs.run-url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          gh pr view "${PULL_REQUEST}" --json body --jq '.body' \
            >.pull-request-body.md
          pnpm exec nx run codometer-cli:start -- changes \
            --baseline codometer-baseline \
            --baseline-url "${BASELINE_URL}" \
            --markdown .pull-request-body.md
          gh pr edit "${PULL_REQUEST}" --body-file .pull-request-body.md

      # Re-raises whatever `make-projects` swallowed above, now that the
      # description section naming the offending bundle has been written.
      - name: 🚦 Enforce Codometer Limits
        if: steps.make-projects.outcome == 'failure'
        run: |
          echo "::error::A project failed to build or breached its limit."
          exit 1
