name: 👷 Make Projects

# Builds every workspace project and measures its bundle. The devcontainer
# image is built by its own workflow, gated on `.devcontainer/**` by
# GitHub's native `on.paths`.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  make-projects:
    name: 👷 Make Projects
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🕋 Setup Codebase
        uses: ./.github/actions/setup-codebase
        with:
          # Builds and bundle sizing touch no Python-backed tool.
          python-dependencies: "false"

      # A breached size limit fails `bundlesize`, and the whole point of the
      # report is to say which bundle broke. So the failure is recorded here and
      # re-raised once the report is written, rather than ending the job while
      # the developer still has nothing to read.
      - name: 👷 Make Projects
        id: make-projects
        continue-on-error: true
        run: pnpm exec nx affected --target=make-projects --parallel=4

      # On main this snapshot becomes the baseline every later pull request
      # compares against, which is what removes the second checkout, install,
      # and full build this job used to run just to size the base branch. A
      # failed build would publish a partial baseline, so it is skipped.
      - name: 📤 Upload Bundle Sizes
        if: >-
          github.ref == 'refs/heads/main'
          && steps.make-projects.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: bundle-sizes-main
          path: |
            applications/**/size-limit-report.json
            packages/**/size-limit-report.json
            tools/**/size-limit-report.json
          retention-days: 90
          if-no-files-found: ignore

      - name: 📥 Download Baseline Bundle Sizes
        id: baseline
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_id="$(gh run list --workflow=make-projects.yml --branch=main \
            --status=success --limit=1 --json databaseId --jq '.[0].databaseId')"
          if [[ -z "${run_id}" ]]; then
            echo "No successful main run to compare against yet."
            exit 0
          fi
          gh run download "${run_id}" --name bundle-sizes-main --dir .bundle-baseline
          echo "run-url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
            >>"${GITHUB_OUTPUT}"

      # The report lives in the description, not a comment. Review automation
      # treats every new pull request comment as feedback needing a reply, so a
      # bot posting build statistics on each push kept waking agents up.
      - name: 🎒 Report Bundle Sizes
        if: github.event_name == 'pull_request'
        env:
          BASELINE_URL: ${{ steps.baseline.outputs.run-url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          pnpm exec tsx scripts/report-bundle-sizes.ts \
            --baseline .bundle-baseline \
            --baseline-url "${BASELINE_URL}" \
            --pull-request "${PULL_REQUEST}"

      # Re-raises whatever `make-projects` swallowed above, now that the
      # description section naming the offending bundle has been written.
      - name: 🚦 Enforce Build And Bundle Limits
        if: steps.make-projects.outcome == 'failure'
        run: |
          echo "::error::A project failed to build or exceeded its size limit."
          exit 1
