name: 👷 Make Projects

# Builds every workspace project and measures its bundle. The devcontainer
# image is built by its own workflow, gated on `.devcontainer/**` by
# GitHub's native `on.paths`.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  make-projects:
    name: 👷 Make Projects
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🕋 Setup Codebase
        uses: ./.github/actions/setup-codebase
        with:
          # Builds and bundle sizing touch no Python-backed tool.
          python-dependencies: "false"

      - name: 👷 Make Projects
        run: pnpm exec nx affected --target=make-projects --parallel=4

      # On main this snapshot becomes the baseline every later pull request
      # compares against, which is what removes the second checkout, install,
      # and full build this job used to run just to size the base branch.
      - name: 📤 Upload Bundle Sizes
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: bundle-sizes-main
          path: |
            applications/**/size-limit-report.json
            packages/**/size-limit-report.json
          retention-days: 90
          if-no-files-found: ignore

      - name: 📥 Download Baseline Bundle Sizes
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_id="$(gh run list --workflow=make-projects.yml --branch=main \
            --status=success --limit=1 --json databaseId --jq '.[0].databaseId')"
          if [[ -z "${run_id}" ]]; then
            echo "No successful main run to compare against yet."
            exit 0
          fi
          gh run download "${run_id}" --name bundle-sizes-main --dir .bundle-baseline

      - name: 📦 Report Bundle Sizes
        if: github.event_name == 'pull_request'
        run: |
          pnpm exec tsx scripts/report-bundle-sizes.ts \
            --baseline .bundle-baseline \
            --output .bundle-report.md

      - name: 💬 Post Bundle Report
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { readFileSync } = require('node:fs');
            const body = readFileSync('.bundle-report.md', 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            const existing = comments.find(
              c => c.user.type === 'Bot' && c.body.includes('Bundle Size Report')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }
