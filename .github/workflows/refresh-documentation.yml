name: 🧑‍🏫 Refresh Documentation

on:
  schedule:
    - cron: 0 0 * * 0 # Weekly Sunday 12am UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-documentation:
    name: 🧑‍🏫 Refresh Documentation
    runs-on: ubuntu-latest
    env:
      OPENWIKI_PROVIDER: gemini
      OPENWIKI_MODEL: gemini-3.6-flash
      OPENWIKI_TELEMETRY_DISABLED: "true"

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🕋 Setup Monorepo
        uses: ./.github/actions/setup-monorepo

      - name: 📦 Verify OpenWiki Installation
        run: pnpm exec openwiki --version

      - name: 🧑‍🏫 Refresh Documentation
        run: pnpm exec nx run monorepo:openwiki-update

      - name: 🔍 Detect Documentation Changes
        id: changes
        run: |
          allowed_paths=(
            README.md
            AGENTS.md
            documentation
            .github/skills
            ':(glob)**/README.md'
            ':(glob)**/AGENTS.md'
          )

          if [[ -n "$(git diff --name-only --diff-filter=ACMDRTUXB -- "${allowed_paths[@]}")" ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🔀 Create or Update Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: docs/monorepo-refresh-documentation
          delete-branch: true
          commit-message: "docs(documentation): 📝 refresh documentation with openwiki"
          title: "docs(documentation): 📝 refresh documentation with OpenWiki"
          body: |
            ## 🌰 Summary

            Refresh repository documentation with OpenWiki-generated updates.

            ## 📝 Details

            - Install and run OpenWiki in repository code mode
            - Update documentation under `openwiki/`
            - Reuse the existing scheduled + manual workflow entrypoint
            - Publish changes on `docs/monorepo-refresh-documentation`

            ## 🧪 Testing

            1. Review the generated diff
            2. Verify the workflow only opens a PR when documentation changes exist
            3. Confirm the OpenWiki update target runs successfully in CI

            ## 🔗 Related

            - *Generated by [🧑‍🏫 Refresh Documentation](${{ format(
              'https://github.com/{0}/actions/workflows/refresh-documentation.yml',
              github.repository) }})*
          labels: |
            automated
