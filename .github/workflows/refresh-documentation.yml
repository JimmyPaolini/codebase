name: 🧑‍🏫 Refresh Documentation

on:
  schedule:
    - cron: 0 0 * * 0 # Weekly Sunday 12am UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-documentation:
    name: 🧑‍🏫 Refresh Documentation
    runs-on: ubuntu-latest
    env:
      OPENWIKI_PROVIDER: gemini
      OPENWIKI_MODEL: gemini-3.6-flash
      GEMINI_API_KEY: ${{ secrets.OPENWIKI_GEMINI_API_KEY }}
      OPENWIKI_TELEMETRY_DISABLED: "true"

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🕋 Setup Monorepo
        uses: ./.github/actions/setup-monorepo

      - name: 📦 Verify OpenWiki Installation
        run: pnpm exec openwiki --version

      - name: 🧑‍🏫 Refresh Documentation
        run: pnpm exec nx run monorepo:openwiki-update

      - name: 🛡️ Enforce AGENTS-only Guardrails
        id: changes
        run: |
          claude_changes=$(
            {
              git diff --name-only --diff-filter=ACMDRTUXB -- CLAUDE.md
              git ls-files --others --exclude-standard -- CLAUDE.md
            } | sort -u
          )

          if [[ -n "$claude_changes" ]]; then
            echo "Reverting CLAUDE.md changes before pull request creation."
            if git ls-files --error-unmatch CLAUDE.md >/dev/null 2>&1; then
              git restore --staged --worktree --source=HEAD -- CLAUDE.md
            else
              rm -f CLAUDE.md
            fi
          fi

          changed_paths=$(
            {
              git diff --name-only --diff-filter=ACMDRTUXB
              git ls-files --others --exclude-standard
            } | { grep -v '^CLAUDE\.md$' || true; } | sort -u
          )

          if [[ -z "$changed_paths" ]]; then
            echo "No allowed documentation changes remain after guardrail checks."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          invalid_paths=()
          while IFS= read -r changed_path; do
            case "$changed_path" in
              openwiki/*|AGENTS.md|.github/workflows/refresh-documentation.yml)
                ;;
              *)
                invalid_paths+=("$changed_path")
                ;;
            esac
          done <<< "$changed_paths"

          if (( ${#invalid_paths[@]} > 0 )); then
            echo "Detected changes outside the allowed OpenWiki paths:"
            printf ' - %s\n' "${invalid_paths[@]}"
            exit 1
          fi

          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: 🔀 Create or Update Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: docs/monorepo-refresh-documentation
          delete-branch: true
          commit-message: "docs(documentation): 📝 refresh documentation with openwiki"
          title: "docs(documentation): 📝 refresh documentation with OpenWiki"
          body: |
            ## 🌰 Summary

            Refresh repository documentation with OpenWiki-generated updates.

            ## 📝 Details

            - Install and run OpenWiki in repository code mode
            - Update documentation under `openwiki/`
            - Reuse the existing scheduled + manual workflow entrypoint
            - Publish changes on `docs/monorepo-refresh-documentation`

            ## 🧪 Testing

            1. Review the generated diff
            2. Verify the workflow only opens a PR when documentation changes exist
            3. Confirm the OpenWiki update target runs successfully in CI

            ## 🔗 Related

            - *Generated by [🧑‍🏫 Refresh Documentation](${{ format(
              'https://github.com/{0}/actions/workflows/refresh-documentation.yml',
              github.repository) }})*
          add-paths: |
            openwiki/**
            AGENTS.md
            .github/workflows/refresh-documentation.yml
          labels: |
            automated
