name: 🧑‍🎤 Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - labeled
      - unlabeled
      - assigned
      - unassigned
  merge_group:
  workflow_dispatch:
    inputs:
      verbose:
        description: Enable verbose Nx logging
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref == 'refs/heads/main'
    && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  continuous-integration:
    name: ${{ matrix.check.emoji }} ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        check:
          - target: typecheck-code
            name: Typecheck
            emoji: 🧑‍🎓
          - target: format-code
            name: Format
            emoji: 🧑‍🎨
          - target: lint-code
            name: Lint
            emoji: 🧑‍💻
          - target: deprecate-code
            name: Deprecate
            emoji: 🧟
          - target: guard-code
            name: Guard
            emoji: 💂
          - target: test-code
            name: Test
            emoji: 🧑‍🔬
          - target: scan-security
            name: Security
            emoji: 🕵️
          - target: judge-conventions
            name: Conventions
            emoji: 🧑‍⚖️
          - target: build-projects
            name: Build
            emoji: 👷

    steps:
      - name: 🚦 Skip If Superseded
        id: supersession
        if: matrix.check.target == 'judge-conventions' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          RUNS_ENDPOINT="repos/${{ github.repository }}/actions"
          RUNS_ENDPOINT="${RUNS_ENDPOINT}/workflows/continuous-integration.yml"
          LATEST_RUN_ID="$(gh api \
            "${RUNS_ENDPOINT}/runs?event=pull_request&branch=${HEAD_BRANCH}" \
            -f per_page=1 \
            --jq '.workflow_runs[0].id')"
          if [ "$LATEST_RUN_ID" != "${{ github.run_id }}" ]; then
            echo "⏭️ Run ${LATEST_RUN_ID} is newer for this pull request."
            echo "superseded=true" >>"$GITHUB_OUTPUT"
          else
            echo "superseded=false" >>"$GITHUB_OUTPUT"
          fi

      - name: 📥 Checkout Repository
        if: steps.supersession.outputs.superseded != 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🕋 Setup Codebase
        id: setup
        if: steps.supersession.outputs.superseded != 'true'
        uses: ./.github/actions/setup-codebase
        with:
          gitleaks: ${{ matrix.check.target == 'scan-security' && 'true' || 'false' }}
          trivy: ${{ matrix.check.target == 'scan-security' && 'true' || 'false' }}
          python-dependencies: >-
            ${{ (matrix.check.target == 'build-projects' ||
            matrix.check.target == 'judge-conventions') && 'false' || 'true' }}
          uv: ${{ matrix.check.target == 'judge-conventions' && 'false' || 'true' }}
          nx-cache: ${{ matrix.check.target == 'judge-conventions' && 'false' || 'true' }}
          nx-graph-cache: >-
            ${{ matrix.check.target == 'judge-conventions' && 'false' || 'true' }}
          nx-shas: ${{ matrix.check.target == 'judge-conventions' && 'false' || 'true' }}
          eslint-cache: ${{ matrix.check.target == 'lint-code' && 'true' || 'false' }}

      - name: ${{ matrix.check.emoji }} Run ${{ matrix.check.name }}
        id: run-check
        if: steps.supersession.outputs.superseded != 'true'
        continue-on-error: ${{ matrix.check.target == 'build-projects' }}
        env:
          NX_VERBOSE_LOGGING: ${{ inputs.verbose || false }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          NODE_OPTIONS: --import=tsx
        run: |
          TARGET="${{ matrix.check.target }}"
          if [[ "${TARGET}" == "judge-conventions" || "${TARGET}" == "scan-security" ]]; then
            [[ "${TARGET}" == "scan-security" ]] && TARGET="scan-security-ci"
            pnpm exec nx run codebase:${TARGET}
          elif [ "${TARGET}" == "test-code" ]; then
            pnpm exec nx affected --target=test-code \
              --configuration=coverage --parallel=4
          else
            CONFIG=$([ "${TARGET}" == "build-projects" ] && echo "" || echo "check")
            pnpm exec nx affected --target=${TARGET} \
              --configuration=${CONFIG}
          fi

      - name: 📏 Measure Changes
        if: >-
          steps.supersession.outputs.superseded != 'true' &&
          matrix.check.target == 'build-projects'
        uses: ./.github/actions/measure-changes
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          is-main-branch: ${{ github.ref == 'refs/heads/main' }}
          is-pull-request: ${{ github.event_name == 'pull_request' }}
          run-outcome: ${{ steps.run-check.outcome }}
          pull-request-number: ${{ github.event.pull_request.number }}

      - name: 🚦 Enforce Codometer Limits
        if: >-
          steps.supersession.outputs.superseded != 'true' &&
          matrix.check.target == 'build-projects' &&
          steps.run-check.outcome == 'failure'
        run: |
          echo "::error::A project failed to build or breached its limit."
          exit 1

      - name: 📊 Upload Type Coverage
        if: >-
          failure() &&
          steps.supersession.outputs.superseded != 'true' &&
          matrix.check.target == 'typecheck-code'
        uses: actions/upload-artifact@v7
        with:
          name: type-coverage-reports
          path: |
            applications/*/type-coverage-report.txt
            packages/*/type-coverage-report.txt
            tools/*/type-coverage-report.txt
          retention-days: 30

      - name: 📊 Upload Test Coverage
        if: >-
          always() &&
          steps.supersession.outputs.superseded != 'true' &&
          matrix.check.target == 'test-code'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            coverage/
            applications/**/coverage/
            packages/**/coverage/
            tools/**/coverage/
          retention-days: 30

      - name: 🧹 Cleanup Codebase
        if: always() && steps.supersession.outputs.superseded != 'true'
        uses: ./.github/actions/cleanup-codebase
        with:
          nx-cache: >-
            ${{ matrix.check.target == 'judge-conventions' && 'false' || 'true' }}
          nx-cache-primary-key: ${{ steps.setup.outputs.nx-cache-primary-key }}
          eslint-cache: ${{ matrix.check.target == 'lint-code' && 'true' || 'false' }}
