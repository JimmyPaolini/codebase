name: 🧑‍💻 Analyze Code

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      verbose:
        description: Enable verbose Nx logging
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-code:
    name: 🧑‍💻 Analyze Code
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🕋 Setup Codebase
        uses: ./.github/actions/setup-codebase

      - name: 🧑‍💻 Analyze Code
        env:
          NX_PARALLEL: 3
          NX_VERBOSE_LOGGING: ${{ inputs.verbose || false }}
        run: pnpm exec nx affected --target=analyze-code --configuration=check

      - name: 📊 Upload Type Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: type-coverage-reports
          path: |
            applications/**/type-coverage-report.txt
            packages/**/type-coverage-report.txt
            tools/**/type-coverage-report.txt
          retention-days: 30
