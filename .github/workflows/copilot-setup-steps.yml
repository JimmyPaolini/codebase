name: 🤖 Setup Copilot

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    name: 🤖 Setup Copilot
    runs-on: ubuntu-latest

    permissions:
      actions: read
      artifact-metadata: read
      attestations: read
      checks: read
      code-quality: read
      contents: read
      deployments: read
      discussions: read
      issues: write
      models: read
      packages: read
      pages: read
      pull-requests: write
      repository-projects: read
      security-events: read
      statuses: read

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🕋 Setup Codebase
        uses: ./.github/actions/setup-codebase

      - name: 🔐 Import GPG Key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: 🔑 Authenticate GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          authentication_token="${GH_TOKEN:-${GITHUB_TOKEN:-}}"
          if [[ -z "${authentication_token}" ]]; then
            echo "GH_TOKEN and GITHUB_TOKEN are both unavailable."
            exit 1
          fi

          echo "::add-mask::${authentication_token}"
          mkdir -p "${HOME}/.config/gh"
          rm -f "${HOME}/.config/gh/hosts.yml"

          printf '%s' "${authentication_token}" | gh auth login --hostname github.com --with-token
          gh auth setup-git
          gh auth status
          gh project list --owner "${GITHUB_REPOSITORY_OWNER}" --limit 1 >/dev/null
        shell: bash
