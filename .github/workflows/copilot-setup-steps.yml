name: 🤖 Setup Copilot

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    name: 🤖 Setup Copilot
    runs-on: ubuntu-latest

    permissions:
      actions: read
      artifact-metadata: read
      attestations: read
      checks: read
      code-quality: read
      contents: read
      deployments: read
      discussions: read
      issues: write
      models: read
      packages: read
      pages: read
      pull-requests: write
      repository-projects: read
      security-events: read
      statuses: read

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🕋 Setup Codebase
        uses: ./.github/actions/setup-codebase

      - name: 🌿 Verify Branch Name
        run: |
          validation_output="$(bash scripts/git/validate-session-branch-name.sh)"
          if [[ -n "${validation_output}" ]]; then
            echo "${validation_output}"
            exit 1
          fi
        shell: bash

      - name: 🔑 Authenticate GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/git/check-gh-authentication.sh
        shell: bash

      - name: 🔐 Import GPG Key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: 🔎 Verify Commit Signing Configuration
        run: |
          validation_output="$(bash scripts/git/validate-session-commit-signing.sh)"
          if [[ -n "${validation_output}" ]]; then
            echo "${validation_output}"
            exit 1
          fi
        shell: bash
