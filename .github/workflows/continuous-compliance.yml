name: 🦹 Continuous Compliance

# External and repository compliance checks outside the codebase:
# 1. 🧑‍💼 Audit Issues: Issue metadata (`type:*`, `scope:*`, and `source:*` labels)
#    and 3-tier hierarchy / release significance validation across open issues.
# 2. 👮 Audit Governance: Repository governance (CODEOWNERS and workflow security).
#
# On `opened`, labels implied by the issue body are reconciled by `issue-labels`
# in `tools/synchronization`. The metadata check is executed by `issue-metadata`
# in `tools/validation`. Governance rules are verified by `audit-governance` in
# `tools/validation`. All run through Node.js directly without building an Nx
# project graph.
#
# Mislabeled issues or governance violations do not block creation on GitHub;
# this workflow fails the job so the status is surfaced on the README badge.

on:
  issues:
    types: [opened, edited, labeled, unlabeled]
  schedule:
    - cron: 18 12 * * 5 # Weekly Friday 8:18am NYC (EDT: 12:18 UTC / EST: 13:18 UTC)
  workflow_dispatch:

permissions:
  contents: read
  # Label creation and updates are issues-scoped endpoints, which is what the
  # label reconciliation step below writes through.
  issues: write

concurrency:
  # One group per run, so no run of this workflow ever waits behind another.
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  continuous-compliance:
    name: ${{ matrix.target.emoji }} ${{ matrix.target.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.target.timeout }}
    if: github.actor != 'dependabot[bot]'
    strategy:
      fail-fast: false
      matrix:
        target:
          - id: audit-issues
            name: Audit Issues
            emoji: 🧑‍💼
            timeout: 10
          - id: audit-governance
            name: Audit Governance
            emoji: 👮
            timeout: 10

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: 📦 Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: 🟢 Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The label reconciliation step and the audit checks run their CLIs
      # directly through node rather than through Nx, so those two projects
      # and the workspace packages they import are all this needs. The trailing
      # `...` on each filter resolves that transitively. Still no Nx cache, no
      # uv, and no Homebrew: there is no project graph to build.
      - name: 📚 Install Root Dependencies
        run: |
          CI=true pnpm install --frozen-lockfile --reporter=append-only \
            --filter . --filter synchronization... --filter validation... \
            --ignore-scripts

      # Only on the event that creates an issue — an edit or a label change
      # never adds a field the body didn't already have, and re-adding labels
      # on every edit would fight a human who removed one on purpose.
      - name: 🏷️ Reconcile Issue Labels
        if: matrix.target.id == 'audit-issues' && github.event.action == 'opened'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_LABELS: ${{ toJSON(github.event.issue.labels) }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          NODE_OPTIONS='' node --import @swc-node/register/esm-register \
            tools/synchronization/src/main.ts issue-labels

      # Read live, by issue number, rather than out of this event's payload.
      - name: 🧾 Audit Single Issue Metadata
        if: matrix.target.id == 'audit-issues' && github.event.issue != null
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          NODE_OPTIONS='' node --import @swc-node/register/esm-register \
            tools/validation/src/main.ts issue-metadata "$ISSUE_NUMBER"

      # Sweeps and audits all open issues and hierarchy relationships on
      # scheduled runs and manual dispatches.
      - name: 🧾 Audit All Open Issues Metadata
        if: matrix.target.id == 'audit-issues' && github.event.issue == null
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NODE_OPTIONS='' node --import @swc-node/register/esm-register \
            tools/validation/src/main.ts issue-metadata --all

      # Audits repository governance (CODEOWNERS rules and workflow security).
      - name: 👮 Audit Repository Governance
        if: matrix.target.id == 'audit-governance'
        run: |
          NODE_OPTIONS='' node --import @swc-node/register/esm-register \
            tools/validation/src/main.ts audit-governance
