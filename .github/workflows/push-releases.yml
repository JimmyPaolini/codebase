name: 🦸 Push Releases

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never cancel a release. Interrupting semantic-release between the npm
# publish and the git tag leaves the repository disagreeing with the registry.
#
# This is the one workflow that keeps a shared group, and so the one whose
# badge can still read red for a run nobody broke: GitHub holds at most one
# *pending* run per group, so a third push to main cancels the queued second
# one. The alternative — a per-commit group, the way the check workflows now
# do it — would let two releases run at once, which is the thing this note
# forbids. A cancelled run here means no release was attempted, and whichever
# run holds main's tip covers its commits; `check-supersession` below is what
# makes that true for the runs that are *not* cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # A run that no longer holds main's tip must not release. `main` moves while
  # a release is in flight — 8–10 minutes of it is the pre-commit hook running
  # the whole lint gate over the version commit — and when it does,
  # `@semantic-release/git` reaches `git push` with a commit built on a stale
  # base, takes a non-fast-forward rejection, and the pre-push hook then fails
  # on `Invalid revision range`. That reads as a release failure rather than as
  # two merges landing 90 seconds apart.

  # Nothing is lost by stopping: every push to main creates a run, so whichever
  # one holds the tip releases the superseded run's commits with its own. A
  # skipped job leaves the run `success`, which keeps the badge honest.

  # It is a job of its own rather than an `if:` on each step below so a
  # superseded run costs seconds instead of the ten minutes setup and build
  # would spend before the release step could decline.
  check-supersession:
    name: 🔭 Check Supersession
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    outputs:
      superseded: ${{ steps.compare.outputs.superseded }}

    steps:
      - name: 🔭 Compare This Commit With main
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          tip="$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)"
          if [ "$tip" = "$SHA" ]; then
            echo "superseded=false" >>"$GITHUB_OUTPUT"
            echo "🦸 $SHA holds main's tip, releasing"
          else
            echo "superseded=true" >>"$GITHUB_OUTPUT"
            echo "⏭️ $SHA superseded by $tip, whose run releases instead"
          fi

  push-releases:
    name: 🦸 Push Releases
    needs: check-supersession
    if: needs.check-supersession.outputs.superseded != 'true'
    runs-on: ubuntu-latest
    # Two populations of run hide behind one average. Most pushes to main
    # release nothing — semantic-release returns in about 3 seconds and the job
    # finishes in 6–7 minutes. A push that does release spends 8–10 minutes in
    # that step, because `@semantic-release/git` makes the version commit with a
    # plain `git commit` and the pre-commit hook runs the whole `lint-codebase`
    # gate over it. Measured end to end, releasing runs have taken 14m24s to
    # 16m18s.
    #
    # So 12 minutes is not available, however comfortably the common run fits
    # inside it: it would pass every no-op and kill every real release, inside
    # the publish step — precisely what the concurrency note above exists to
    # prevent. 18 leaves roughly 10% over the slowest release yet seen.
    timeout-minutes: 18

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # This job looks like it runs no Nx target, but it runs the whole static
      # analysis gate: `@semantic-release/git` makes the version commit with a
      # plain `git commit`, which fires the pre-commit hook, which runs
      # `nx affected --target=lint-codebase` over every project the root
      # package.json touches. So it needs uv — yaml-lint, sqlfluff, and vulture
      # all shell out to `uv run` — and it wants both Nx caches for the 241
      # tasks that follow. Opting out of them failed the release outright with
      # `uv: not found`.
      #
      # `nx-shas` stays off: lint-staged passes `--files=` for each staged path,
      # which supersedes NX_BASE and NX_HEAD.
      - name: 🕋 Setup Codebase
        uses: ./.github/actions/setup-codebase
        with:
          nx-shas: "false"

      - name: 🔐 Import GPG Key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: 🔎 Check Commit Signing Configuration
        run: bash scripts/git/check-commit-signing-configuration.sh

      # Every project is built before anything is measured, because a project's
      # own badge block reports on compiled output that does not exist in a
      # fresh checkout. `codometer` already depends on `build` for exactly this
      # reason, so the build is named here only to keep the steps legible in the
      # job log — a build failure should not read as a measurement one.
      - name: 👷 Build Projects
        run: pnpm exec nx run-many --target=build

      # Every report is published here rather than on pull requests: each one
      # is regenerated from whatever main now holds, and `@semantic-release/git`
      # commits it with the changelog.
      #
      # Ordering is load-bearing: a writer that counts files another writer
      # produces has to go second. Callidescope, the module-graph
      # synchronization, and codependix all splice blocks into project
      # README.md and AGENTS.md files; codometer counts the lines of those
      # files, so codometer goes last. The three splicers may run in any order
      # relative to each other, each writing between its own markers.
      #
      # `--write` exits 1 when it could not measure something, so a transient
      # failure fails this job rather than committing half-written READMEs.
      # Every step below is a `write` configuration no pull-request workflow
      # can reach; their gates run there under `check`.
      - name: 🔭 Trace Call Stacks
        run: pnpm exec nx run codebase:callidescope:write

      # `codependix map --write` covers all three graph types (Nx, NestJS, file
      # imports) in one run — no per-graph-type subcommand, see
      # `codependix.config.ts`. Same split as `callidescope` above: `check`
      # (verifying every configured export is current) is what a pull request
      # would run, but nothing does, since `codependix map --check` is deliberately
      # absent from `lint-codebase` and every pull-request-triggered workflow —
      # the exports move with the workspace they describe, so gating a branch
      # on their staleness would fail it for something `main` did.
      - name: 🕸️ Export Dependency Graphs
        run: pnpm exec nx run codebase:codependix:write

      # Every synchronization command is its own Nx target, run directly the
      # way `callidescope` and `codometer` are above — no aggregate command
      # loops over them. On main the derivations are already in sync — the
      # pull request gate is what proves it — so this writes them back
      # unchanged.
      - name: 🔗 Publish Derivations
        run: |
          pnpm exec nx run-many \
            --target=conformetry-generators --target=conventional-config \
            --target=devcontainer-configuration --target=pull-request-template \
            --target=skill-exclusions --configuration=write

      # Two codometer commands, in this order, because the second measures the
      # output of the first: the workspace report counts every markdown file in
      # the repository, project READMEs included, so measuring the repository
      # before those READMEs are rewritten publishes an aggregate that the same
      # run then invalidates. Projects first, repository last.
      - name: 📊 Measure Codebase
        run: |
          pnpm exec nx run-many --target=codometer --configuration=write --exclude=codebase
          pnpm exec nx run codebase:codometer:write

      # The committer is overridden so GitHub can verify the signature that `🔐
      # Import GPG Key` already produces. semantic-release forces author and
      # committer to `semantic-release-bot <semantic-release-bot@martynus.net>`,
      # and GitHub verifies by matching the *committer* email against an address
      # the signing key carries and the account has verified — a domain nobody
      # here owns never is, so every release commit read `Unverified` despite
      # being correctly signed. `index.js` spreads its own `...env` after those
      # defaults, so what is set here wins.
      #
      # Only the committer pair is set; the author stays the bot, so the log
      # still says a machine cut the release.
      #
      # Not cosmetic: `main`'s ruleset has `required_signatures`, and these
      # commits land only because the admin role holds an always bypass.
      - name: 🦸 Push Releases
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GIT_COMMITTER_EMAIL: jimmypaolini@gmail.com
          GIT_COMMITTER_NAME: Jimmy Paolini
        run: pnpm semantic-release
