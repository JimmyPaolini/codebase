name: 🦸 Push Releases

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never cancel a release. Interrupting semantic-release between the npm
# publish and the git tag leaves the repository disagreeing with the registry.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  push-releases:
    name: 🦸 Push Releases
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # This job looks like it runs no Nx target, but it runs the whole static
      # analysis gate: `@semantic-release/git` makes the version commit with a
      # plain `git commit`, which fires the pre-commit hook, which runs
      # `nx affected --target=lint-codebase` over every project the root
      # package.json touches. So it needs uv — yaml-lint, sqlfluff, and vulture
      # all shell out to `uv run` — and it wants both Nx caches for the 241
      # tasks that follow. Opting out of them failed the release outright with
      # `uv: not found`.
      #
      # `nx-shas` stays off: lint-staged passes `--files=` for each staged path,
      # which supersedes NX_BASE and NX_HEAD.
      - name: 🕋 Setup Codebase
        uses: ./.github/actions/setup-codebase
        with:
          nx-shas: "false"

      - name: 🔐 Import GPG Key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: 🔎 Check Commit Signing Configuration
        run: bash scripts/git/check-commit-signing-configuration.sh

      # Every project is built before anything is measured, because a project's
      # own badge block reports on compiled output that does not exist in a
      # fresh checkout. `codometer` already depends on `build` for exactly this
      # reason, so the build is named here only to keep the steps legible in the
      # job log — a build failure should not read as a measurement one.
      - name: 👷 Build Projects
        run: pnpm exec nx run-many --target=build

      # Every report is published here rather than on pull requests: each one is
      # regenerated from whatever main now holds, and `@semantic-release/git`
      # commits it with the changelog. A release that does not happen leaves the
      # rewrites uncommitted, which is the same thing the changelog does.
      #
      # Ordering is load-bearing, and the rule is that a writer which counts
      # files another writer produces has to go second. Callidescope and the
      # module-graph synchronization both splice blocks into project README.md
      # and AGENTS.md files; codometer counts the lines of those same files, so
      # codometer goes last — measuring first would publish figures one release
      # behind the documents they describe. The two splicers may run in either
      # order relative to each other: each writes between its own markers and
      # leaves the rest of the file as it found it.
      #
      # `--write` exits 1 when it could not measure something it was asked to
      # measure, so a transient failure fails this job rather than committing a
      # half-written set of READMEs. Nothing here amends or force-pushes: the
      # rewrites ride along in the release commit or wait for the next one.
      #
      # Every step below is the `write` configuration of a target none of the
      # pull-request workflows can reach with a configuration of their own:
      # none of these three hangs off `lint-codebase`'s `dependsOn`, so `write`
      # means publish here and nowhere else. Their gates run on a pull request
      # under `check`, named directly by the workflow that owns them.
      - name: 🔭 Trace Call Stacks
        run: pnpm exec nx run codebase:callidescope:write

      # `synchronize:write` drives both kinds, so it rewrites derivations as
      # well as publishing the module graphs. On main the derivations are
      # already in sync — the pull request gate is what proves it — so this
      # writes them back unchanged and only the reports move.
      - name: 🕸️ Publish Module Graphs
        run: pnpm exec nx run synchronization:synchronize:write

      # Two codometer commands, in this order, because the second measures the
      # output of the first: the workspace report counts every markdown file in
      # the repository, project READMEs included, so measuring the repository
      # before those READMEs are rewritten publishes an aggregate that the same
      # run then invalidates. Projects first, repository last.
      - name: 📊 Measure Codebase
        run: |
          pnpm exec nx run-many --target=codometer --configuration=write --exclude=codebase
          pnpm exec nx run codebase:codometer:write

      - name: 🦸 Push Releases
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: pnpm semantic-release
