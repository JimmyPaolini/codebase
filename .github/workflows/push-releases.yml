name: 🦸 Push Releases

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never cancel a release. Interrupting semantic-release between the npm
# publish and the git tag leaves the repository disagreeing with the registry.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  push-releases:
    name: 🦸 Push Releases
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # This job looks like it runs no Nx target, but it runs the whole static
      # analysis gate: `@semantic-release/git` makes the version commit with a
      # plain `git commit`, which fires the pre-commit hook, which runs
      # `nx affected --target=lint-codebase` over every project the root
      # package.json touches. So it needs uv — yaml-lint, sqlfluff, and vulture
      # all shell out to `uv run` — and it wants both Nx caches for the 241
      # tasks that follow. Opting out of them failed the release outright with
      # `uv: not found`.
      #
      # `nx-shas` stays off: lint-staged passes `--files=` for each staged path,
      # which supersedes NX_BASE and NX_HEAD.
      - name: 🕋 Setup Codebase
        uses: ./.github/actions/setup-codebase
        with:
          nx-shas: "false"

      - name: 🔐 Import GPG Key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: 🔎 Check Commit Signing Configuration
        run: bash scripts/git/check-commit-signing-configuration.sh

      # Every project is built before it is measured, because a project's own
      # badge block reports on compiled output that does not exist in a fresh
      # checkout. `codometer` already depends on `build` for exactly this
      # reason, so the build is named here only to keep the two steps legible
      # in the job log — a build failure should not read as a measurement one.
      - name: 👷 Build Projects
        run: pnpm exec nx run-many --target=build

      # Measured here rather than on pull requests: every badge block is
      # regenerated from whatever main now holds — the workspace README and
      # each project README — and `@semantic-release/git` commits them with the
      # changelog. A release that does not happen leaves the rewrite
      # uncommitted, which is the same thing the changelog does.
      #
      # `--write` exits 1 when it could not measure something it was asked to
      # measure, so a transient failure fails this job rather than committing a
      # half-written set of READMEs. Nothing here amends or force-pushes: the
      # READMEs ride along in the release commit or wait for the next one.
      #
      # Two commands, in this order, because the second measures the output of
      # the first: the workspace report counts every markdown file in the
      # repository, project READMEs included, so measuring the repository
      # before those READMEs are rewritten publishes an aggregate that the same
      # run then invalidates. Projects first, repository last, and both are
      # current in the commit that follows.
      - name: 📊 Measure Codebase
        run: |
          pnpm exec nx run-many --target=codometer --configuration=write --exclude=codebase
          pnpm exec nx run codebase:codometer:write

      - name: 🦸 Push Releases
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: pnpm semantic-release
