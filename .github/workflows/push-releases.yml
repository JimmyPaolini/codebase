name: 🦸 Push Releases

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never cancel a release. Interrupting semantic-release between the npm
# publish and the git tag leaves the repository disagreeing with the registry.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  push-releases:
    name: 🦸 Push Releases
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # This job looks like it runs no Nx target, but it runs the whole static
      # analysis gate: `@semantic-release/git` makes the version commit with a
      # plain `git commit`, which fires the pre-commit hook, which runs
      # `nx affected --target=lint-codebase` over every project the root
      # package.json touches. So it needs uv — yaml-lint, sqlfluff, and vulture
      # all shell out to `uv run` — and it wants both Nx caches for the 241
      # tasks that follow. Opting out of them failed the release outright with
      # `uv: not found`.
      #
      # `nx-shas` stays off: lint-staged passes `--files=` for each staged path,
      # which supersedes NX_BASE and NX_HEAD.
      - name: 🕋 Setup Codebase
        uses: ./.github/actions/setup-codebase
        with:
          nx-shas: "false"

      - name: 🔐 Import GPG Key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: 🔎 Check Commit Signing Configuration
        run: bash scripts/git/check-commit-signing-configuration.sh

      # Every report is published here rather than on pull requests: each one
      # is regenerated from whatever main now holds, and
      # `@semantic-release/git` commits it with the changelog. A release that
      # does not happen leaves the rewrites uncommitted, which is the same
      # thing the changelog does.
      #
      # Ordering matters for the same reason the projects are measured before
      # the workspace aggregate: a run that counts files another run writes has
      # to go second. Both report writers splice blocks into project README.md
      # and AGENTS.md files, and codometer counts the lines of those same
      # files, so codometer goes last — measuring first would publish figures
      # one release behind the documents they describe. The two writers can go
      # in either order relative to each other: each splices between its own
      # markers and leaves the rest of the file as it found it.
      - name: 🔭 Trace Call Stacks
        run: pnpm exec nx run codebase:callidescope:publish

      - name: 🕸️ Publish Module Graphs
        run: pnpm exec nx run synchronization:synchronize:publish

      - name: 📊 Measure Codebase
        run: pnpm exec nx run codebase:codometer:write

      - name: 🦸 Push Releases
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: pnpm semantic-release
