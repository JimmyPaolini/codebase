name: 🧹 Form Codebase

# Static code analysis: every check that reads the source without executing it.
# One `nx affected` invocation builds one task graph and one scheduler runs it.
# This replaced `analyze-code`, whose composite targets spawned a nested `nx
# run` per tool — 290 project graph builds for one logical command.

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      verbose:
        description: Enable verbose Nx logging
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Per-commit on `main`, per-ref everywhere else. This workflow's README badge
  # renders every non-`success` conclusion red, `cancelled` among them, so a
  # merge landing while the previous one still runs leaves the badge reporting
  # a superseded run rather than a broken one. Roughly a quarter of merges land
  # inside a run window, and the badge stays red until the next merge clears it.
  #
  # `cancel-in-progress: false` alone would not fix that, which is the trap:
  # GitHub keeps at most one *pending* run per group, so a third push cancels
  # the queued second whatever this flag says. Only a group nothing else can
  # join keeps a `main` run out of that queue.
  #
  # Pull request branches keep cancelling, where no badge reads the conclusion.
  group: >-
    ${{ github.workflow }}-${{ github.ref == 'refs/heads/main'
    && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  form-codebase:
    name: 🧹 Form Codebase
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🕋 Setup Codebase
        id: setup
        uses: ./.github/actions/setup-codebase
      # `codependix` and each derivation synchronization are named alongside
      # `lint-codebase` rather than hanging off its `dependsOn`, because each
      # also publishes on the default branch and Nx forwards an explicit
      # configuration down `dependsOn`: reachable from `lint-codebase
      # --configuration=write`, one would publish from a branch. Naming them
      # here keeps their gates on every pull request — a broken boundary rule,
      # derivation drift — without writing a file. `codependix --check
      # boundaries` reads no export destination, so it never fails a branch
      # for stale exports; it stays out of lint-staged because a `ts.Program`
      # per project takes twenty seconds.

      # `gate` carries no configuration of its own — the callidescope Nx
      # plugin infers it with none — so the forwarding hazard above never
      # reaches it; there is nothing for `dependsOn` to forward in the first
      # place. It is still named here rather than wired that way because
      # `nx affected` scopes it exactly the way it scopes `lint-codebase`
      # itself: to the projects a change actually touched, so the task that
      # fails is named after the project that regressed — what the single
      # workspace-wide `callidescope --check depth` run this replaced never
      # could do.

      # `codometer` is absent on purpose: all fifty projects declare that
      # target, so naming it here would fan out over every one and wait on each
      # build. 👷 Make Projects gates it instead, which already fans
      # `make-projects` out over them.

      # There is no aggregate `synchronize` target: each is its own Nx target,
      # joining the same `nx affected` invocation, so one task graph owns the
      # run.
      - name: 🧹 Form Codebase
        env:
          NX_VERBOSE_LOGGING: ${{ inputs.verbose || false }}
        run: |
          pnpm exec nx affected --target=form-codebase --configuration=check

      # Last, unconditionally: a cold run of this task graph runs close
      # enough to this job's timeout that whether one commit's first attempt
      # finishes in time is close to a coin flip. Saving whatever `.nx/cache`
      # holds even when the flip goes the other way is what lets a retry, or
      # the next commit pushed, build on real progress instead of redoing it.
      - name: 🧹 Cleanup Codebase
        if: always()
        uses: ./.github/actions/cleanup-codebase
        with:
          nx-cache-primary-key: ${{ steps.setup.outputs.nx-cache-primary-key }}
