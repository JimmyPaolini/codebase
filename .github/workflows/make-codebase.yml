name: 🧑‍🔧 Make Codebase

# Its own workflow so GitHub's native `on.paths` does the filtering. This lived
# as a job inside Make Projects for a while, gated by `dorny/paths-filter`,
# because `on.paths` cannot be scoped to a single job — that needed an extra
# job, a `needs:`, an `outputs:` block and a third-party action to express what
# four lines of `paths` say here, and it reported a pass rather than a skip.

on:
  push:
    branches:
      - main
    paths:
      - .devcontainer/**
  pull_request:
    branches:
      - main
    paths:
      - .devcontainer/**
      - .github/workflows/make-codebase.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  make-codebase:
    name: 🧑‍🔧 Make Codebase
    runs-on: ubuntu-latest
    # Pull requests are skipped until the registry cache is seeded. Every layer
    # of this build is currently a cache miss —
    # `ghcr.io/jimmypaolini/codebase-devcontainer` has never been published, so
    # `cacheFrom` imports nothing and the image is rebuilt cold, ~11 minutes for
    # the build and ~2 for the test. A skip rather than a `push: never` run, so
    # a pull request cannot report a pass for a devcontainer nobody built.
    #
    # `push` is deliberately still live: `push: filter` below publishes the
    # image on every `.devcontainer/**` change that lands on main, and that
    # publish is the only thing that seeds the cache the pull request path
    # needs. Disabling the job outright would have foreclosed it. Restore the
    # pull request path once a run has published an image.
    if: github.event_name != 'pull_request'

    # 20, not 12. The seeding run is cold by definition — ~11 minutes to build,
    # plus the image upload, plus the test — and the uniform 12-minute pull
    # request cap in #350 is what cancelled this job mid-test in the first
    # place. Revisit once a warm run has shown what the real ceiling is.
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      # No `setup-codebase`: nothing here runs Nx. The VS Code extension sync
      # check that used to justify it is a `lint-codebase` leaf now.
      - name: 🗂️ Setup Environment File
        run: |
          cp .env.default .env
          echo "LOCAL_WORKSPACE_FOLDER=$GITHUB_WORKSPACE" >> .env

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Build Devcontainer Image
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/cloud/devcontainer.json
          imageName: ghcr.io/jimmypaolini/codebase-devcontainer
          cacheFrom: |
            type=gha,scope=devcontainer
            ghcr.io/jimmypaolini/codebase-devcontainer
          push: filter
          eventFilterForPush: |
            push:
              branches:
                - main
          env: |
            CI=true
            GH_TOKEN=${{ secrets.GITHUB_TOKEN }}
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}

      - name: 🔬 Test Devcontainer Image
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/cloud/devcontainer.json
          imageName: ghcr.io/jimmypaolini/codebase-devcontainer
          cacheFrom: |
            type=gha,scope=devcontainer
            ghcr.io/jimmypaolini/codebase-devcontainer
          push: never
          env: |
            CI=true
            GH_TOKEN=${{ secrets.GITHUB_TOKEN }}
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          runCmd: |
            bash .devcontainer/scripts/test-devcontainer.sh
