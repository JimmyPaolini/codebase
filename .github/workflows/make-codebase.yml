name: 🧑‍🔧 Make Codebase

# Its own workflow so GitHub's native `on.paths` does the filtering. This lived
# as a job inside Make Projects for a while, gated by `dorny/paths-filter`,
# because `on.paths` cannot be scoped to a single job — that needed an extra
# job, a `needs:`, an `outputs:` block and a third-party action to express what
# four lines of `paths` say here, and it reported a pass rather than a skip.

on:
  push:
    branches:
      - main
    paths:
      - .devcontainer/**
  pull_request:
    branches:
      - main
    paths:
      - .devcontainer/**
      - .github/workflows/make-codebase.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  make-codebase:
    name: 🧑‍🔧 Make Codebase
    runs-on: ubuntu-latest
    # Pull requests are skipped until the registry cache is seeded. Every layer
    # of this build is currently a cache miss —
    # `ghcr.io/jimmypaolini/codebase-devcontainer` has never been published, so
    # `cacheFrom` imports nothing and the image is rebuilt cold, ~11 minutes for
    # the build and ~2 for the test. A skip rather than a `push: never` run, so
    # a pull request cannot report a pass for a devcontainer nobody built.
    #
    # `push` is deliberately still live: `push: filter` below publishes the
    # image on every `.devcontainer/**` change that lands on main, and that
    # publish is the only thing that seeds the cache the pull request path
    # needs. Disabling the job outright would have foreclosed it. Restore the
    # pull request path once a run has published an image.
    if: github.event_name != 'pull_request'

    # 30, not 12. The seeding run is cold by definition and now also exports a
    # cache and pushes an image: ~11 minutes to build, plus the cache export,
    # plus the image upload, plus ~2 for the test. The uniform 12-minute pull
    # request cap in #350 is what cancelled this job mid-test to begin with,
    # and being cancelled mid-upload would seed nothing while looking like
    # progress. Bring it back down once a warm run has shown the real ceiling.
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      # No `setup-codebase`: nothing here runs Nx. The VS Code extension sync
      # check that used to justify it is a `lint-codebase` leaf now.
      - name: 🗂️ Setup Environment File
        run: |
          cp .env.default .env
          echo "LOCAL_WORKSPACE_FOLDER=$GITHUB_WORKSPACE" >> .env

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Build Devcontainer Image
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/cloud/devcontainer.json
          imageName: ghcr.io/jimmypaolini/codebase-devcontainer

          # A dedicated `:build-cache` tag, not the image itself. The action
          # publishes with a plain `docker push`, which embeds no inline cache,
          # so the image is not a usable cache source however often it is
          # pushed — `cacheTo` is what writes one. Registry rather than
          # `type=gha`: GitHub evicts cache entries unused for seven days, and
          # this workflow only fires on `.devcontainer/**` changes, which are
          # routinely further apart than that. A cache that expires before the
          # next run is one nobody can see failing.
          cacheFrom: |
            type=registry,ref=ghcr.io/jimmypaolini/codebase-devcontainer:build-cache
          cacheTo: |
            type=registry,ref=ghcr.io/jimmypaolini/codebase-devcontainer:build-cache,mode=max

          # `refFilterForPush` and `eventFilterForPush` are both flat lists of
          # literal strings — `getMultilineInput`, compared with `===` against
          # `GITHUB_REF` and `GITHUB_EVENT_NAME`. They are not the nested
          # `on:`-style object they look like. Written as one, every line
          # mismatched and the push was skipped on the one event it existed to
          # allow, silently, for as long as no push event ever reached it.
          push: filter
          refFilterForPush: |
            refs/heads/main
          eventFilterForPush: |
            push
          env: |
            CI=true
            GH_TOKEN=${{ secrets.GITHUB_TOKEN }}
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}

      - name: 🔬 Test Devcontainer Image
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/cloud/devcontainer.json
          imageName: ghcr.io/jimmypaolini/codebase-devcontainer
          cacheFrom: |
            type=registry,ref=ghcr.io/jimmypaolini/codebase-devcontainer:build-cache
          push: never
          env: |
            CI=true
            GH_TOKEN=${{ secrets.GITHUB_TOKEN }}
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          runCmd: |
            bash .devcontainer/scripts/test-devcontainer.sh
