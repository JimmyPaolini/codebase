name: 🧑‍⚖️ Validate Conventions

# Pull request metadata only — branch name, title, and body. These are not Nx
# targets and have no project graph to build, so this workflow deliberately
# skips `setup-codebase`: no Nx cache, no uv, no Homebrew, no full install.
#
# The repository-convention checks that used to live here (conformetry,
# codometer, and the synchronization checks) are `lint-codebase` dependsOn
# leaves now, so they run once per change instead of once per workflow.

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-conventions:
    name: 🧑‍⚖️ Validate Conventions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.actor != 'dependabot[bot]' &&
      !startsWith(github.head_ref, 'dependabot/') &&
      !startsWith(github.head_ref, 'renovate/')

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: 🟢 Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # commitlint and validate-branch-name are the only dependencies these
      # checks need, and both live in the root manifest.
      - name: 📚 Install Root Dependencies
        run: |
          CI=true pnpm install --frozen-lockfile --reporter=append-only \
            --filter . --ignore-scripts

      - name: 🎋 Validate Branch Name
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ -z "$BRANCH_NAME" ]; then
            echo "❌ Unable to determine Branch Name"
            exit 1
          fi
          pnpm exec validate-branch-name -t "$BRANCH_NAME"

      - name: 📝 Validate Pull Request Title
        env:
          PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
          NODE_OPTIONS: --import=tsx
        run: |
          if [ -z "$PULL_REQUEST_TITLE" ]; then
            echo "❌ Unable to determine Pull Request Title"
            exit 1
          fi
          echo "$PULL_REQUEST_TITLE" \
            | pnpm exec commitlint --config configuration/commitlint.config.ts

      - name: 🪢 Validate Pull Request Body
        env:
          PULL_REQUEST_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -z "$PULL_REQUEST_BODY" ]; then
            echo "❌ Unable to determine Pull Request Body"
            exit 1
          fi
          MISSING=""
          printf '%s' "$PULL_REQUEST_BODY" | grep -q "^## 🌰 Summary" || \
            MISSING="$MISSING 🌰 Summary"
          printf '%s' "$PULL_REQUEST_BODY" | grep -q "^## 📝 Details" || \
            MISSING="$MISSING 📝 Details"
          printf '%s' "$PULL_REQUEST_BODY" | grep -q "^## 🧪 Testing" || \
            MISSING="$MISSING 🧪 Testing"
          printf '%s' "$PULL_REQUEST_BODY" | grep -q "^## 🔗 Related" || \
            MISSING="$MISSING 🔗 Related"
          if [ -n "$MISSING" ]; then
            echo "❌ Missing required sections:$MISSING"
            echo ""
            echo "PR description must include: ## 🌰 Summary, " \
              "## 📝 Details, ## 🧪 Testing, ## 🔗 Related"
            echo "See: .github/PULL_REQUEST_TEMPLATE.md"
            exit 1
          fi
          echo "✅ All required sections present"
