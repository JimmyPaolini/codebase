name: 🧑‍⚖️ Validate Conventions

# Pull request metadata — branch name, title, body, labels, and assignees.
# These are not Nx targets and have no project graph to build, so this
# workflow deliberately skips `setup-codebase`: no Nx cache, no uv, no
# Homebrew, no full install.
#
# The repository-convention checks that used to live here (conformetry,
# codometer, and the synchronization checks) are `lint-codebase` dependsOn
# leaves now, so they run once per change instead of once per workflow. The
# issue-metadata check that used to sit here as a second job is its own
# workflow now, 👮 Audit Issues — it fired on `issues` events, so it reported
# "skipped" on every pull request event and left one badge standing for two
# unrelated signals.
#
# The job is thin: checkout, install, run a `tools/validation` check. On
# `merge_group` the job skips, which is the whole point of that trigger; see
# the note on it below.
#
# The README's Validate Conventions badge is this workflow's own status badge,
# and it asks for `?event=pull_request` rather than the `?branch=main` every
# other badge there uses. A badge with no query — or with a `branch` — reports
# the newest run whose `head_branch` matches, and no run this workflow can
# produce any longer has `head_branch: main`: a `pull_request` run carries the
# head ref, and a `merge_group` run carries the queue's own
# `gh-readonly-queue/main/...` ref. While the issue-metadata job still lived
# here, the `issues` trigger did produce `main` runs, so `?branch=main` worked;
# the moment that job left for 👮 Audit Issues the badge froze on the last of
# them and reported a September 2026 verdict forever. Filtering on the event
# instead follows the runs that actually exist. A dependabot or renovate pull
# request is the one wrinkle — the job's `if` skips those, and a skipped run
# reports no status — but the next real pull request clears it, which a frozen
# `branch` filter never does.
#
# On a pull request's `opened`/`reopened`, the conventional label vocabulary
# is reconciled against the repository first, so a freshly opened pull
# request has the labels it needs to pass. That reconciliation is a
# nest-commander command in `tools/synchronization`, run through node
# directly rather than through Nx — the same invocation that project's own
# targets use — so this workflow still builds no project graph. It is one of
# only two synchronizations needing credentials: neither `lint-codebase` nor
# the release workflow, which run every other synchronization, holds a token,
# so this is the one caller that asks for `pull-request-labels` by name — the
# other is 👮 Audit Issues, which asks for `issue-labels` the same way.
#
# The metadata, body, and release-significance checks are nest-commander
# commands in `tools/validation`, invoked the same way and for the same
# reason. All are one-sided — a `check` with no `write` to reconcile against —
# which is why they live there rather than beside the label synchronizers.
#
# Release significance needs a token: unlike the others, its input is not in
# the `pull_request` webhook payload — that event never carries a pull
# request's full commit list — so it calls `gh pr view --json title,commits`
# itself, the same way the label reconciliation step does.

on:
  pull_request:
    types:
      [
        opened,
        reopened,
        synchronize,
        edited,
        labeled,
        unlabeled,
        assigned,
        unassigned,
        milestoned,
        demilestoned,
        ready_for_review,
        converted_to_draft,
        review_requested,
        review_request_removed,
      ]
  # This workflow is a required status check, so the merge queue waits on its
  # context before it will fast-forward main. Every check it runs reads the
  # `pull_request` payload — a title, a body, labels, assignees, a head ref —
  # and none of that exists on a `merge_group` event, nor can any of it have
  # changed while the pull request sat in the queue: the queue rebases
  # commits, never metadata. So the trigger exists purely so the workflow
  # fires and resolves its context; the job below skips itself on this event,
  # and a skipped required check counts as satisfied. Without the trigger no
  # context is ever created and the queue entry waits for the timeout instead.
  merge_group:

permissions:
  contents: read
  # Label creation and updates are issues-scoped endpoints, not pull-request
  # ones, so this write permission is what the reconciliation step below
  # writes through.
  issues: write
  # `gh pr view --json title,commits` is a pull-requests-scoped read, needed
  # by the release-significance check below.
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Deliberately not cancelling. One `gh pr edit` that adds a few labels and
  # an assignee fires several of the events above within a second, and this
  # workflow is a required check: were a `cancelled` conclusion to land after
  # a successful one, the check would sit red with no further event left to
  # clear it, leaving the pull request unmergeable. These runs take about
  # thirty seconds and build no Nx graph, so cancelling saves almost nothing.
  cancel-in-progress: false

jobs:
  validate-conventions:
    name: 🧑‍⚖️ Validate Conventions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event_name == 'pull_request' &&
      github.actor != 'dependabot[bot]' &&
      !startsWith(github.head_ref, 'dependabot/') &&
      !startsWith(github.head_ref, 'renovate/')

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: 🟢 Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # commitlint and validate-branch-name live in the root manifest; the label
      # reconciliation step and the two validation steps below run their CLIs
      # directly through node rather than through Nx, so those two projects and
      # the workspace packages they import are all this needs on top. The
      # trailing `...` on each filter resolves those transitively, so nothing
      # here names `@codebase/logger` or the conformetry packages by hand.
      # Still no Nx cache, no uv, and no Homebrew: there is no project graph to
      # build.
      - name: 📚 Install Root Dependencies
        run: |
          CI=true pnpm install --frozen-lockfile --reporter=append-only \
            --filter . --filter synchronization... --filter validation... \
            --ignore-scripts

      - name: 🎋 Validate Branch Name
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ -z "$BRANCH_NAME" ]; then
            echo "❌ Unable to determine Branch Name"
            exit 1
          fi
          pnpm exec validate-branch-name -t "$BRANCH_NAME"

      - name: 📝 Validate Pull Request Title
        env:
          PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
          NODE_OPTIONS: --import=tsx
        run: |
          if [ -z "$PULL_REQUEST_TITLE" ]; then
            echo "❌ Unable to determine Pull Request Title"
            exit 1
          fi
          echo "$PULL_REQUEST_TITLE" \
            | pnpm exec commitlint --config configuration/commitlint.config.ts

      # Read through `gh pr view` into a file rather than the webhook's own
      # `github.event.pull_request.body` as an environment variable: a large
      # enough description — the `⏲️ Codometer` change report, uncapped, can
      # run to hundreds of rows — pushes the runner's combined argv and
      # environment size past the OS limit, and `bash` itself fails to start
      # with "Argument list too long" before this step gets to run anything.
      # A file has no such ceiling.
      - name: 🪢 Validate Pull Request Body
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          gh pr view "${PULL_REQUEST}" --json body --jq '.body' \
            >.pull-request-body.md
          NODE_OPTIONS='' node --import @swc-node/register/esm-register \
            tools/validation/src/main.ts pull-request-body \
            .pull-request-body.md

      - name: 🏷️ Ensure Pull Request Labels
        if: >-
          github.event.action == 'opened' ||
          github.event.action == 'reopened'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NODE_OPTIONS='' node --import @swc-node/register/esm-register \
            tools/synchronization/src/main.ts pull-request-labels write

      # Read the metadata live by passing the number, rather than from the
      # webhook payload's own `assignees`, `labels`, and `title`. The payload is
      # a snapshot taken when the event fired, and on `opened` that is before
      # the assignee exists: `gh pr create --assignee` attaches it in a
      # follow-up request, so an `opened` run saw `assignees: []` and failed a
      # pull request that was correctly assigned a second later. A re-run could
      # never clear it either, because a re-run replays the same frozen payload.
      #
      # The step above already reconciles labels through the API with this same
      # token, so this job was never hermetic and reading live costs it nothing.
      # It also drops the full JSON label array from the environment, which is
      # the same argv-and-environment size ceiling the body step avoids.
      - name: 🧾 Validate Pull Request Metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          NODE_OPTIONS='' node --import @swc-node/register/esm-register \
            tools/validation/src/main.ts pull-request-metadata \
            "${PULL_REQUEST_NUMBER}"

      - name: 📈 Validate Pull Request Release Significance
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          NODE_OPTIONS='' node --import @swc-node/register/esm-register \
            tools/validation/src/main.ts pull-request-release-significance
