name: 🧑‍⚖️ Validate Conventions

# Pull request metadata only — branch name, title, body, labels, and
# assignees. These are not Nx targets and have no project graph to build, so
# this workflow deliberately skips `setup-codebase`: no Nx cache, no uv, no
# Homebrew, no full install.
#
# The repository-convention checks that used to live here (conformetry,
# codometer, and the synchronization checks) are `lint-codebase` dependsOn
# leaves now, so they run once per change instead of once per workflow.
#
# On `opened`/`reopened` the conventional label vocabulary is reconciled
# against the repository before metadata validation runs, so a freshly
# opened pull request has the labels it needs to pass.
#
# That reconciliation is a nest-commander command in `tools/synchronization`,
# run through node directly rather than through Nx — the same invocation that
# project's own targets use — so this workflow still builds no project graph.
# It is the `repository` synchronization kind, which nothing else selects:
# `lint-codebase` checks `derivation` and the release workflow writes
# `derivation,report`, so neither of them needs a token.

on:
  pull_request:
    types:
      [
        opened,
        reopened,
        synchronize,
        edited,
        labeled,
        unlabeled,
        assigned,
        unassigned,
        milestoned,
        demilestoned,
        ready_for_review,
        converted_to_draft,
        review_requested,
        review_request_removed,
      ]

permissions:
  contents: read
  # Label creation and updates are issues-scoped endpoints, not pull-request
  # ones, so this write permission exists solely for that reconciliation step.
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Deliberately not cancelling. One `gh pr edit` that adds a few labels and
  # an assignee fires several of the events above within a second, and this
  # workflow is a required check: were a `cancelled` conclusion to land after
  # a successful one, the check would sit red with no further event left to
  # clear it, leaving the pull request unmergeable. These runs take about
  # thirty seconds and build no Nx graph, so cancelling saves almost nothing.
  cancel-in-progress: false

jobs:
  validate-conventions:
    name: 🧑‍⚖️ Validate Conventions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.actor != 'dependabot[bot]' &&
      !startsWith(github.head_ref, 'dependabot/') &&
      !startsWith(github.head_ref, 'renovate/')

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: 🟢 Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # commitlint and validate-branch-name live in the root manifest; the label
      # reconciliation step below runs the synchronization CLI directly through
      # node rather than through Nx, so that project and the workspace packages
      # it imports are all this needs on top. `--filter synchronization...`
      # resolves those transitively, so nothing here names `@codebase/logger`
      # or the conformetry packages by hand. Still no Nx cache, no uv, and no
      # Homebrew: there is no project graph to build.
      - name: 📚 Install Root Dependencies
        run: |
          CI=true pnpm install --frozen-lockfile --reporter=append-only \
            --filter . --filter synchronization... --ignore-scripts

      - name: 🎋 Validate Branch Name
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ -z "$BRANCH_NAME" ]; then
            echo "❌ Unable to determine Branch Name"
            exit 1
          fi
          pnpm exec validate-branch-name -t "$BRANCH_NAME"

      - name: 📝 Validate Pull Request Title
        env:
          PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
          NODE_OPTIONS: --import=tsx
        run: |
          if [ -z "$PULL_REQUEST_TITLE" ]; then
            echo "❌ Unable to determine Pull Request Title"
            exit 1
          fi
          echo "$PULL_REQUEST_TITLE" \
            | pnpm exec commitlint --config configuration/commitlint.config.ts

      - name: 🪢 Validate Pull Request Body
        env:
          PULL_REQUEST_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -z "$PULL_REQUEST_BODY" ]; then
            echo "❌ Unable to determine Pull Request Body"
            exit 1
          fi
          MISSING=""
          printf '%s' "$PULL_REQUEST_BODY" | grep -q "^## 🌰 Summary" || \
            MISSING="$MISSING 🌰 Summary"
          printf '%s' "$PULL_REQUEST_BODY" | grep -q "^## 📝 Details" || \
            MISSING="$MISSING 📝 Details"
          printf '%s' "$PULL_REQUEST_BODY" | grep -q "^## 🧪 Testing" || \
            MISSING="$MISSING 🧪 Testing"
          printf '%s' "$PULL_REQUEST_BODY" | grep -q "^## 🔗 Related" || \
            MISSING="$MISSING 🔗 Related"
          UNFILLED=""
          printf '%s' "$PULL_REQUEST_BODY" \
            | grep -q "<!-- Brief description of what this PR does" && \
            UNFILLED="$UNFILLED
          - <!-- Brief description of what this PR does ... -->"
          printf '%s' "$PULL_REQUEST_BODY" \
            | grep -q "<!-- List of specific changes made" && \
            UNFILLED="$UNFILLED
          - <!-- List of specific changes made -->"
          printf '%s' "$PULL_REQUEST_BODY" \
            | grep -q "<!-- How to manually verify these changes work" && \
            UNFILLED="$UNFILLED
          - <!-- How to manually verify these changes work ... -->"
          printf '%s' "$PULL_REQUEST_BODY" \
            | grep -q "<!-- Link any relevant documentation or related" && \
            UNFILLED="$UNFILLED
          - <!-- Link any relevant documentation or related ... -->"
          if [ -z "$MISSING" ] && [ -z "$UNFILLED" ]; then
            echo "✅ All required sections present"
            exit 0
          fi
          if [ -n "$MISSING" ]; then
            echo "❌ Missing required sections:$MISSING"
            echo ""
          fi
          if [ -n "$UNFILLED" ]; then
            echo "❌ Unfilled template comments remain:$UNFILLED"
            echo ""
          fi
          echo "PR description must include: ## 🌰 Summary, " \
            "## 📝 Details, ## 🧪 Testing, ## 🔗 Related, " \
            "with every template comment replaced by real content."
          echo "See: .github/PULL_REQUEST_TEMPLATE.md"
          exit 1

      - name: 🏷️ Ensure Pull Request Labels
        if: >-
          github.event.action == 'opened' ||
          github.event.action == 'reopened'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NODE_OPTIONS='' node --import @swc-node/register/esm-register \
            tools/synchronization/src/main.ts synchronization write \
            --kinds repository

      - name: 🧾 Validate Pull Request Metadata
        env:
          PULL_REQUEST_ASSIGNEES: >-
            ${{ toJSON(github.event.pull_request.assignees) }}
          PULL_REQUEST_LABELS: ${{ toJSON(github.event.pull_request.labels) }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
        run: bash scripts/git/validate-pull-request-metadata.sh
