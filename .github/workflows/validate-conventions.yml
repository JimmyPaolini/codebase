name: 🧑‍⚖️ Validate Conventions

# Pull request metadata — branch name, title, body, labels, and assignees.
# None is an Nx target, so this workflow skips `setup-codebase`: no Nx cache,
# no uv or Homebrew, no full install. The job is checkout, install, run a
# check, skipping on `merge_group`.
#
# The checks are nest-commander commands in `tools/validation` and, for label
# reconciliation on `opened`/`reopened`, `tools/synchronization` — invoked
# through node rather than Nx so no project graph is built. Reconciling first
# is what lets a newly opened pull request pass. Release significance also
# needs a token: the `pull_request` payload carries no commit list, so it
# calls `gh pr view` itself.
#
# The README badge must be filtered `?event=pull_request`. Nothing here runs
# on the default branch, so `?branch=main` pins it to a stale run forever.

# Dependabot pull requests are no longer exempted from title, label, or
# release-significance checks: `.github/dependabot.yml` sets a
# `commit-message.prefix` on every entry so the generated title and commit
# both read as this repository's own `<type>(<scope>): <gitmoji> <subject>`,
# and carries the `type:`, `scope:`, and `source:agent` labels statically,
# so nothing here has to derive them. Only the body check below still skips
# dependabot — there is no dependabot.yml field for pull request body
# content, so that one check can never pass for it.

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - labeled
      - unlabeled
      - assigned
      - unassigned
      - milestoned
      - demilestoned
      - ready_for_review
      - converted_to_draft
      - review_requested
      - review_request_removed

  # This workflow is a required status check, so the merge queue waits on its
  # context before it will fast-forward main. Every check it runs reads the
  # `pull_request` payload — a title, a body, labels, assignees, a head ref —
  # and none of that exists on a `merge_group` event, nor can any of it have
  # changed while the pull request sat in the queue: the queue rebases
  # commits, never metadata. So the trigger exists purely so the workflow
  # fires and resolves its context; the job below skips itself on this event,
  # and a skipped required check counts as satisfied. Without the trigger no
  # context is ever created and the queue entry waits for the timeout instead.
  merge_group:

permissions:
  contents: read
  # Label creation and updates are issues-scoped endpoints, not pull-request
  # ones, so this write permission is what the reconciliation step below
  # writes through.
  issues: write
  # `gh pr view --json title,commits` is a pull-requests-scoped read, needed
  # by the release-significance check below.
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Still not cancelling. This only trims the ordinary case — one pending run
  # queued behind whatever is in progress — and is not what keeps the check
  # from getting stuck: GitHub does not serialize a burst of same-second
  # events reliably (see the "🚦 Skip If Superseded" step below, which is the
  # part that actually makes this safe). Cancelling here would race that step
  # for no benefit, since these runs take about thirty seconds and build no
  # Nx graph.
  cancel-in-progress: false

jobs:
  validate-conventions:
    name: 🧑‍⚖️ Validate Conventions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event_name == 'pull_request' &&
      !startsWith(github.head_ref, 'renovate/')

    steps:
      # `gh pr create --label a --label b --assignee @me` fires `opened` plus
      # one `labeled` event per label plus `assigned`, all within a second or
      # two — each one a `pull_request` trigger above. The `concurrency`
      # block below only queues one pending run behind whatever is in
      # progress; it does not serialize a burst like this reliably, and a
      # stale `cancelled` conclusion can land after a later `success` with no
      # further event left to replace it, leaving the required check stuck.
      # Deciding this in-job rather than trusting GitHub's queue ordering
      # makes it deterministic: bail out if a newer run of this workflow
      # already exists for this branch.
      - name: 🚦 Skip If Superseded
        id: supersession
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref }}
          RUNS_ENDPOINT: repos/${{ github.repository }}/actions/workflows/validate-conventions.yml/runs
        run: |
          LATEST_RUN_ID="$(gh api \
            "${RUNS_ENDPOINT}?event=pull_request&branch=${HEAD_BRANCH}&per_page=1" \
            --jq '.workflow_runs[0].id')"
          if [ "$LATEST_RUN_ID" != "${{ github.run_id }}" ]; then
            echo "⏭️ Run ${LATEST_RUN_ID} is newer for this pull request."
            echo "superseded=true" >>"$GITHUB_OUTPUT"
          else
            echo "superseded=false" >>"$GITHUB_OUTPUT"
          fi

      - name: 📥 Checkout Repository
        if: steps.supersession.outputs.superseded == 'false'
        uses: actions/checkout@v7

      - name: 📦 Setup pnpm
        if: steps.supersession.outputs.superseded == 'false'
        uses: ./.github/actions/setup-pnpm

      - name: 🟢 Setup node
        if: steps.supersession.outputs.superseded == 'false'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # commitlint and validate-branch-name live in the root manifest; the label
      # reconciliation step and the two validation steps below run their CLIs
      # directly through node rather than through Nx, so those two projects and
      # the workspace packages they import are all this needs on top. The
      # trailing `...` on each filter resolves those transitively, so nothing
      # here names `@codebase/logger` or the conformetry packages by hand.
      # Still no Nx cache, no uv, and no Homebrew: there is no project graph to
      # build.
      - name: 📚 Install Root Dependencies
        if: steps.supersession.outputs.superseded == 'false'
        run: |
          CI=true pnpm install --frozen-lockfile --reporter=append-only \
            --filter . --filter synchronization... --filter validation... \
            --ignore-scripts

      - name: 🎋 Validate Branch Name
        if: steps.supersession.outputs.superseded == 'false'
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ -z "$BRANCH_NAME" ]; then
            echo "❌ Unable to determine Branch Name"
            exit 1
          fi
          pnpm exec validate-branch-name -t "$BRANCH_NAME"

      - name: 📝 Validate Pull Request Title
        if: steps.supersession.outputs.superseded == 'false'
        env:
          PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
          NODE_OPTIONS: --import=tsx
        run: |
          if [ -z "$PULL_REQUEST_TITLE" ]; then
            echo "❌ Unable to determine Pull Request Title"
            exit 1
          fi
          echo "$PULL_REQUEST_TITLE" \
            | pnpm exec commitlint --config configuration/commitlint.config.ts

      # Read through `gh pr view` into a file rather than the webhook's own
      # `github.event.pull_request.body` as an environment variable: a large
      # enough description — the `⏲️ Codometer` change report, uncapped, can
      # run to hundreds of rows — pushes the runner's combined argv and
      # environment size past the OS limit, and `bash` itself fails to start
      # with "Argument list too long" before this step gets to run anything.
      # A file has no such ceiling.
      #
      # Skipped for dependabot: there is no dependabot.yml field for pull
      # request body content (an open upstream feature request as of this
      # writing — dependabot/dependabot-core#13905), so a dependabot pull
      # request can never carry the four required headings. Everything else
      # in this job still runs against it.
      - name: 🪢 Validate Pull Request Body
        if: >-
          steps.supersession.outputs.superseded == 'false' &&
          github.actor != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          gh pr view "${PULL_REQUEST}" --json body --jq '.body' \
            >.pull-request-body.md
          NODE_OPTIONS='' node --import @swc-node/register/esm-register \
            tools/validation/src/main.ts pull-request-body \
            .pull-request-body.md

      - name: 🏷️ Ensure Pull Request Labels
        if: >-
          steps.supersession.outputs.superseded == 'false' &&
          (github.event.action == 'opened' || github.event.action == 'reopened')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NODE_OPTIONS='' node --import @swc-node/register/esm-register \
            tools/synchronization/src/main.ts pull-request-labels write

      # Read the metadata live by passing the number, rather than from the
      # webhook payload's own `assignees`, `labels`, and `title`. The payload is
      # a snapshot taken when the event fired, and on `opened` that is before
      # the assignee exists: `gh pr create --assignee` attaches it in a
      # follow-up request, so an `opened` run saw `assignees: []` and failed a
      # correctly assigned pull request. A re-run could never clear it either,
      # because it replays the same frozen payload.
      #
      # The step above already reconciles labels through the API with this same
      # token, so this job was never hermetic and reading live costs it nothing.
      # It also drops the full JSON label array from the environment, the same
      # argv-and-environment size ceiling the body step avoids.
      - name: 🧾 Validate Pull Request Metadata
        if: steps.supersession.outputs.superseded == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          NODE_OPTIONS='' node --import @swc-node/register/esm-register \
            tools/validation/src/main.ts pull-request-metadata \
            "${PULL_REQUEST_NUMBER}"

      - name: 📈 Validate Pull Request Release Significance
        if: steps.supersession.outputs.superseded == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          NODE_OPTIONS='' node --import @swc-node/register/esm-register \
            tools/validation/src/main.ts pull-request-release-significance
