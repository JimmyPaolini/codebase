name: 📦 Setup pnpm
description: |
  Install the pnpm version `package.json`'s `packageManager` field pins,
  restoring it from cache rather than fetching it from the npm registry on
  every run (requires checkout first).

  `pnpm/action-setup` is not cheap and its cost is not predictable.  It
  deletes its `dest` directory, writes a `package.json` and a
  `package-lock.json` naming the pnpm version bundled with the action, runs
  `npm ci` against them, and only then runs `pnpm self-update` to the version
  this repository actually pins.  That `npm ci` is a registry round trip on
  every job of every workflow, and it took between 4.7 seconds and 7 minutes
  across a single evening's runs on `main` — the same evening npm's advisory
  endpoint was timing out and failing `pnpm audit`.  Two jobs died of it:
  🧑‍🔬 Test Coverage was killed at its 12-minute limit with every step already
  green, and 🦸 Push Releases at its 20-minute limit part way through
  `semantic-release`.

  So the whole install is cached and the action is skipped on a hit, the same
  arrangement `setup-codebase` already uses for Homebrew.  Skipping it is not
  an optimization here but a requirement: the action's first act is to delete
  `dest`, so a restored cache handed to it is erased before it is read.

  The key names the pinned version and nothing else.  A version bump is the
  only thing that should invalidate this, and unlike the Homebrew key there is
  no weekly rotation, because `packageManager` is the whole point — a pin that
  drifted to whatever the registry served last week would be no pin at all.
outputs:
  version:
    description: The pnpm version resolved from `packageManager`
    value: ${{ steps.pnpm-version.outputs.version }}

runs:
  using: composite
  steps:
    # Read with `sed` rather than `node -p`, because this action runs before
    # `actions/setup-node` and must not depend on whatever node the runner
    # image happens to ship. The `+` guard drops the optional integrity hash
    # in `pnpm@1.2.3+sha512.abc`, which is part of the pin but not of the
    # version.
    - name: 🧮 Resolve pnpm Version
      id: pnpm-version
      run: |
        version="$(
          grep -o '"packageManager": *"pnpm@[^"+]*' package.json \
            | sed 's/.*pnpm@//'
        )"
        if [ -z "${version}" ]; then
          echo "❌ No pnpm version found in package.json's packageManager field"
          exit 1
        fi
        echo "version=${version}" >>"$GITHUB_OUTPUT"
      shell: bash

    - name: ♻️ Sync pnpm Cache
      id: pnpm-cache
      uses: actions/cache@v6
      with:
        path: ~/setup-pnpm
        key: pnpm-${{ runner.os }}-${{ steps.pnpm-version.outputs.version }}

    - name: 📦 Setup pnpm
      if: steps.pnpm-cache.outputs.cache-hit != 'true'
      uses: pnpm/action-setup@v6

    # `pnpm/action-setup` puts pnpm on PATH itself; on a cache hit it never
    # runs, so the same three environment changes have to be made by hand.
    # They mirror what the action does on Linux with a bundled node: PNPM_HOME
    # is `dest/node_modules/.bin`, and both it and its `bin` subdirectory go on
    # PATH, since pnpm v10 and v11 disagree about which of the two holds the
    # shims.
    - name: 🛤️ Restore Cached pnpm PATH
      if: steps.pnpm-cache.outputs.cache-hit == 'true'
      run: |
        pnpm_home="${HOME}/setup-pnpm/node_modules/.bin"
        echo "PNPM_HOME=${pnpm_home}" >>"$GITHUB_ENV"
        echo "${pnpm_home}" >>"$GITHUB_PATH"
        echo "${pnpm_home}/bin" >>"$GITHUB_PATH"
      shell: bash

    # A cache entry is immutable, so a damaged one would otherwise break every
    # job until the pinned version changed. Rather than trust the restore,
    # confirm the pnpm now on PATH reports the pinned version and reinstall if
    # it does not. This step is also what proves the hand-rolled PATH above
    # still matches what the action does, so an upgrade that moves the shims
    # fails loudly on the next run instead of silently reinstalling forever.
    - name: 🔎 Verify Cached pnpm
      if: steps.pnpm-cache.outputs.cache-hit == 'true'
      id: pnpm-verify
      env:
        EXPECTED_VERSION: ${{ steps.pnpm-version.outputs.version }}
      run: |
        actual="$(pnpm --version 2>/dev/null || true)"
        if [ "${actual}" = "${EXPECTED_VERSION}" ]; then
          echo "usable=true" >>"$GITHUB_OUTPUT"
        else
          echo "usable=false" >>"$GITHUB_OUTPUT"
          echo "::warning::Cached pnpm reported '${actual}', expected" \
            "'${EXPECTED_VERSION}' — reinstalling from the registry."
        fi
      shell: bash

    - name: 🩹 Repair pnpm Install
      if: |
        steps.pnpm-cache.outputs.cache-hit == 'true'
        && steps.pnpm-verify.outputs.usable != 'true'
      uses: pnpm/action-setup@v6
