name: 📦 Setup pnpm
description: |
  Install the pnpm version `package.json`'s `packageManager` field pins,
  restoring the install from cache rather than refetching it every run
  (requires checkout first).

  This still uses `pnpm/action-setup`; it only stops paying for it twice. That
  action writes a `package.json` and `package-lock.json` naming the pnpm
  version bundled with the action — 11.19.0, hardcoded in its own bundle —
  runs `npm ci` against them, and only then runs `pnpm self-update` to the
  version this repository pins. The `npm ci` is an uncached registry round
  trip on every job of every workflow, and it ranged from 4.7 seconds to 7
  minutes across one evening's runs on `main`. Two jobs died of it: 🧑‍🔬 Test
  Coverage was killed at its 12-minute limit with every step already green,
  and 🦸 Push Releases at its 20-minute limit part way through
  `semantic-release`.

  The action's own `cache` input does not help, and neither does `version` or
  `standalone`. `cache` caches the pnpm *store* — dependency tarballs, keyed
  on `pnpm-lock.yaml` — which `actions/setup-node` already caches here, and it
  works by running `pnpm store path`, so it can only run after the install it
  would need to skip. `version` changes which version `self-update` moves to
  but not the `npm ci`, which installs from that bundled lockfile either way.
  Upstream
  has no setting for this: pnpm/action-setup#141 asks for exactly this
  configurability and has sat open since 2024.

  Skipping the action on a cache hit is a requirement rather than an
  optimization: its first act is to delete its `dest`, so a restored cache
  handed to it is erased before it is read.

  The key names the pinned version and nothing else. A version bump is the
  only thing that should invalidate this, and unlike `setup-codebase`'s
  Homebrew key there is deliberately no weekly rotation — `packageManager` is
  the whole point, and a pin that drifted to whatever the registry served last
  week would be no pin at all.
outputs:
  version:
    description: The pnpm version resolved from `packageManager`
    value: ${{ steps.pnpm-version.outputs.version }}

runs:
  using: composite
  steps:
    # Read with `grep`/`sed` rather than `node -p`, because this action runs
    # before `actions/setup-node` and must not depend on whichever node the
    # runner image happens to ship. Stopping at `+` drops the optional
    # integrity hash in `pnpm@1.2.3+sha512.abc`.
    - name: 🧮 Resolve pnpm Version
      id: pnpm-version
      run: |
        version="$(
          grep -o '"packageManager": *"pnpm@[^"+]*' package.json \
            | sed 's/.*pnpm@//'
        )"
        if [ -z "${version}" ]; then
          echo "❌ No pnpm version found in package.json's packageManager field"
          exit 1
        fi
        echo "version=${version}" >>"$GITHUB_OUTPUT"
      shell: bash

    - name: ♻️ Sync pnpm Cache
      id: pnpm-cache
      uses: actions/cache@v6
      with:
        path: ~/setup-pnpm
        key: pnpm-${{ runner.os }}-${{ steps.pnpm-version.outputs.version }}

    - name: 📦 Setup pnpm
      if: steps.pnpm-cache.outputs.cache-hit != 'true'
      uses: pnpm/action-setup@v6

    # `pnpm/action-setup` puts pnpm on PATH itself, so on a cache hit the same
    # three environment changes have to be made by hand. These mirror what it
    # does on Linux with a bundled node: PNPM_HOME is `dest/node_modules/.bin`,
    # and both it and its `bin` subdirectory go on PATH, because pnpm v10 and
    # v11 disagree about which of the two holds the shims.
    - name: 🛤️ Restore Cached pnpm PATH
      if: steps.pnpm-cache.outputs.cache-hit == 'true'
      run: |
        pnpm_home="${HOME}/setup-pnpm/node_modules/.bin"
        echo "PNPM_HOME=${pnpm_home}" >>"$GITHUB_ENV"
        echo "${pnpm_home}" >>"$GITHUB_PATH"
        echo "${pnpm_home}/bin" >>"$GITHUB_PATH"
      shell: bash

    # Two jobs in one, both about the step above rather than about the cache.
    # A cache entry is immutable, so a damaged one would otherwise break every
    # job until the pinned version changed — hence the reinstall. And this is
    # the only thing tying the hand-rolled PATH to the action's real behavior,
    # so an upgrade that moves the shims surfaces here, as a warning naming
    # both versions, instead of as `pnpm: command not found` three steps later.
    - name: 🔎 Verify Cached pnpm
      if: steps.pnpm-cache.outputs.cache-hit == 'true'
      id: pnpm-verify
      env:
        EXPECTED_VERSION: ${{ steps.pnpm-version.outputs.version }}
      run: |
        actual="$(pnpm --version 2>/dev/null || true)"
        if [ "${actual}" = "${EXPECTED_VERSION}" ]; then
          echo "usable=true" >>"$GITHUB_OUTPUT"
        else
          echo "usable=false" >>"$GITHUB_OUTPUT"
          echo "::warning::Cached pnpm reported '${actual}', expected" \
            "'${EXPECTED_VERSION}' — reinstalling from the registry."
        fi
      shell: bash

    - name: 🩹 Repair pnpm Install
      if: |
        steps.pnpm-cache.outputs.cache-hit == 'true'
        && steps.pnpm-verify.outputs.usable != 'true'
      uses: pnpm/action-setup@v6
