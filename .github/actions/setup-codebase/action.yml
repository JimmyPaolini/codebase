name: 🕋 Setup Codebase
description: |
  Nx codebase setup with pnpm, node, and cache management
  (requires checkout first)

  Every optional step is gated by an input so a job pays only for what it
  uses. Homebrew alone costs ~13s, and it exists solely to install the
  security scanners, so only the security gate should ask for it.

inputs:
  gitleaks:
    description: Install gitleaks via Homebrew (secret scanning)
    default: "false"
  install:
    description: Install node dependencies with pnpm
    default: "true"
  nx-cache:
    description: Restore and save the Nx task cache
    default: "true"
  nx-graph-cache:
    description: |
      Restore and save the Nx project graph (.nx/workspace-data, minus the
      task-result database, which travels with the task cache). Saves ~11s of
      cold graph construction on the first Nx invocation of a job.
    default: "true"
  nx-shas:
    description: Resolve NX_BASE and NX_HEAD, required by `nx affected`
    default: "true"
  python-dependencies:
    description: |
      Sync the uv workspace into the shared root `.venv`. Defaults on because
      that venv is where `uv run yamllint` and `uv run sqlfluff` resolve from,
      and those run on every TypeScript project — not only the Python ones.
      Turn it off for a job that runs no Python-backed tool at all.
    default: "true"
  trivy:
    description: Install trivy via Homebrew (infrastructure scanning)
    default: "false"
  uv:
    description: |
      Install uv. Required by far more than the Python projects — yaml-lint
      and sqlfluff shell out to `uv run --project configuration` on every
      TypeScript project too.
    default: "true"

runs:
  using: composite
  steps:
    - name: 📦 Setup pnpm
      uses: ./.github/actions/setup-pnpm

    - name: 🟢 Setup node
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: 🎯 Set Nx SHAs
      if: inputs.nx-shas == 'true'
      uses: nrwl/nx-set-shas@v5

    - name: 🗃️ Configure Nx Cache
      run: echo "NX_DEFAULT_OUTPUT_STYLE=static" >> "$GITHUB_ENV"
      shell: bash

    # `Homebrew/actions/setup-homebrew` clones the `Homebrew/brew` git
    # repository from scratch every run (~20s) before `brew install` even
    # starts. Caching the whole linuxbrew prefix skips both that clone and the
    # package install on a cache hit. The key rotates weekly rather than
    # staying fixed, so `gitleaks`/`trivy` still pick up new releases on
    # roughly the same cadence as the weekly full-history secret scan, instead
    # of freezing at whatever version first populated the cache.
    - name: 🗓️ Resolve Weekly Cache Key
      if: inputs.gitleaks == 'true' || inputs.trivy == 'true'
      id: homebrew-cache-week
      run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: ♻️ Sync Homebrew Tools Cache
      if: inputs.gitleaks == 'true' || inputs.trivy == 'true'
      id: homebrew-tools-cache
      uses: actions/cache@v6
      with:
        path: /home/linuxbrew/.linuxbrew
        key: |
          homebrew-tools-${{ runner.os }}-gitleaks-${{ inputs.gitleaks
          }}-trivy-${{ inputs.trivy }}-${{
          steps.homebrew-cache-week.outputs.week }}

    - name: 🔧 Setup Homebrew
      if: |
        (inputs.gitleaks == 'true' || inputs.trivy == 'true')
        && steps.homebrew-tools-cache.outputs.cache-hit != 'true'
      uses: Homebrew/actions/setup-homebrew@main

    - name: 🍺 Install Homebrew Tools
      if: |
        (inputs.gitleaks == 'true' || inputs.trivy == 'true')
        && steps.homebrew-tools-cache.outputs.cache-hit != 'true'
      env:
        INSTALL_GITLEAKS: ${{ inputs.gitleaks }}
        INSTALL_TRIVY: ${{ inputs.trivy }}
      run: |
        packages=()
        if [[ "${INSTALL_GITLEAKS}" == "true" ]]; then
          packages+=(gitleaks)
        fi
        if [[ "${INSTALL_TRIVY}" == "true" ]]; then
          packages+=(trivy)
        fi
        brew install --quiet "${packages[@]}"
      shell: bash

    # `setup-homebrew` puts the linuxbrew bin directory on PATH as a side
    # effect of bootstrapping brew itself; skipping that step on a cache hit
    # means doing the same PATH update by hand.
    - name: 🛤️ Restore Cached Homebrew PATH
      if: |
        (inputs.gitleaks == 'true' || inputs.trivy == 'true')
        && steps.homebrew-tools-cache.outputs.cache-hit == 'true'
      run: echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
      shell: bash

    # Keyed per job. Every workflow previously shared one key, so concurrent
    # jobs on a single SHA raced and all but one failed to reserve it — the
    # cache was effectively write-only.
    #
    # The task-result database is cached here rather than with the graph,
    # because it is the index of these files and the two must never come from
    # different tarballs. Nx splits a cached task across two directories:
    # `.nx/cache/<hash>` holds the output files and
    # `.nx/cache/terminalOutputs/<hash>` the recorded log, while the row saying
    # the task is cached at all lives in `.nx/workspace-data/*.db`. Nx decides
    # a hit from that row alone, so a job holding a row whose files it never
    # restored reports `[local cache]`, prints an empty terminal output,
    # restores nothing, and exits 0 — a build that leaves no `dist/` behind and
    # says nothing about it. That is what failed 🦸 Push Releases run
    # 33827705049 at `📊 Measure Codebase`: `logger:build` hit hollow, so
    # `packages/logger/dist` never appeared and codometer measured a project
    # whose compiled output was not there. Which tasks hit hollow is a lottery,
    # because the two keys are matched independently and a re-run draws a
    # different pair — attempt 2 of that same run restored another database,
    # rebuilt `logger`, and got through the step. A green re-run is luck rather
    # than a fix, which is what makes this worth keying correctly instead of
    # retrying. The reverse mismatch is safe: files with no row are an ordinary
    # cache miss.
    - name: ♻️ Sync Nx Cache
      if: inputs.nx-cache == 'true'
      uses: actions/cache@v6
      with:
        path: |
          .nx/cache
          .nx/workspace-data/*.db*
        key: |
          nx-cache-${{ github.job }}-${{ runner.os }}-${{ hashFiles(
          'pnpm-lock.yaml') }}-${{ github.sha }}
        restore-keys: |
          nx-cache-${{ github.job }}-${{ runner.os }}-${{ hashFiles(
          'pnpm-lock.yaml') }}-
          nx-cache-${{ github.job }}-${{ runner.os }}-

    # Exact match only, and no restore-keys: a partially stale project graph
    # is worse than rebuilding one. `nx reset` clears it if it ever misbehaves.
    #
    # The task-result database is excluded and cached with `.nx/cache` above —
    # see that step for what restoring the two from different tarballs does.
    # This key is shared by every job and matched on `project.json` content
    # alone, which is exactly the sharing the database must not have. Nothing
    # is lost by leaving it out: what this cache saves lives in
    # `project-graph.json` and `file-map.json`, and a data directory holding
    # those but no database builds the graph just as fast as a complete one.
    #
    # `v2` retires every tarball written before the exclusion. `path` decides
    # what is archived, not what is extracted, so an entry saved under the old
    # key would still deliver the database it was saved with.
    - name: 🕸️ Sync Nx Graph
      if: inputs.nx-graph-cache == 'true'
      uses: actions/cache@v6
      with:
        path: |
          .nx/workspace-data
          !.nx/workspace-data/*.db*
        key: |
          nx-graph-v2-${{ runner.os }}-${{ hashFiles(
          'pnpm-lock.yaml', 'nx.json', 'project.json',
          'applications/*/project.json', 'packages/*/project.json',
          'tools/*/project.json') }}

    - name: 🌌 Setup uv
      if: inputs.uv == 'true'
      uses: astral-sh/setup-uv@v10.0.1
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock
        add-problem-matchers: "false"

    # Guarded on `uv` as well as its own input: `python-dependencies` defaults
    # on, so a job that opts out of installing uv would otherwise inherit a sync
    # it has no binary to run.
    - name: 🐍 Install Python Dependencies
      if: inputs.uv == 'true' && inputs.python-dependencies == 'true'
      # Syncs every uv workspace member into the shared root `.venv`. Scoping
      # this to a single project (`--project`) would prune the other members'
      # tools out of that shared environment.
      run: uv sync --frozen --quiet
      shell: bash

    # pnpm's bundled node-gyp lands `gyp/gyp_main.py` without an executable bit.
    # gyp runs it through `python3` itself, so generating a Makefile works — but
    # the Makefile gyp writes carries a self-regenerating rule that invokes the
    # same script as an executable, and that rule fires whenever `binding.gyp`
    # is not older than the Makefile. sweph writes `src/functions.cpp` from a
    # `preinstall` script, so both land in the same second and make's comparison
    # goes either way, which is why the install fails intermittently rather than
    # never or always. The failure reads as `gyp_main.py: Permission denied`
    # under a native build and looks like a code regression; it is not one.
    - name: 🔨 Repair node-gyp Permissions
      if: inputs.install == 'true'
      run: |
        pnpm_binary="$(readlink -f "$(command -v pnpm)")"
        pnpm_package_directory="$(dirname "${pnpm_binary}")/.."
        find "${pnpm_package_directory}" -name gyp_main.py -exec chmod +x {} + \
          || echo "No bundled gyp_main.py found; nothing to repair."
      shell: bash

    # The root `postinstall` script already runs `scripts/install-skills.sh`
    # after this, which is idempotent and returns in milliseconds when every
    # locked skill is already on disk (true here since skills are committed).
    # A separate `skills experimental_install` step used to run redundantly
    # afterward, bypassing that guard and re-cloning every upstream skill
    # source on every job — that duplicate work is why this step is gone.
    - name: 📚 Install Node Dependencies
      if: inputs.install == 'true'
      run: CI=true pnpm install --frozen-lockfile --reporter=append-only
      shell: bash
