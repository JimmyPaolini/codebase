name: 🎯 Run Affected
description: |
  Run `nx affected` for one target, computing the changed files itself and
  piping them in over `--stdin` (requires `setup-codebase` with `nx-shas`).

  Spelling files are dropped from that list unless `include-spelling` is set.
  `spell-check` lists the shared dictionaries among its `{workspaceRoot}`
  inputs, and Nx decides affected per project, not per target: one new word
  in a dictionary marks every project affected for every target, so a word
  list edit ran the whole workspace's tests and timed the job out. Only the
  target that runs `spell-check` should see those files.

  The list is built the way Nx builds its own from `NX_BASE` and `NX_HEAD`
  (their merge base, then `git diff --name-only --no-renames --relative`), so
  a change set with no spelling files is affected exactly as before. An empty
  list affects nothing and exits cleanly; it never falls back to everything.

inputs:
  target:
    description: The Nx target to run on every affected project
    required: true
  arguments:
    description: Extra `nx affected` flags, space separated
    default: ""
  include-spelling:
    description: |
      Keep spelling files in the changed file list. Set it only for the
      target whose `dependsOn` runs `spell-check`.
    default: "false"

runs:
  using: composite
  steps:
    - name: 🎯 Run Affected
      env:
        TARGET: ${{ inputs.target }}
        ARGUMENTS: ${{ inputs.arguments }}
        INCLUDE_SPELLING: ${{ inputs.include-spelling }}
        SPELLING_PATHS: ^configuration/\.cspell/|(^|/)cspell\.config\.yaml$
      run: |
        if [[ -z "${NX_BASE:-}" || -z "${NX_HEAD:-}" ]]; then
          echo "❌ NX_BASE and NX_HEAD are unset; run setup-codebase first"
          exit 1
        fi

        base="$(git merge-base "${NX_BASE}" "${NX_HEAD}" || echo "${NX_BASE}")"
        changed="$(git diff --name-only --no-renames --relative \
          "${base}" "${NX_HEAD}")"

        if [[ "${INCLUDE_SPELLING}" != "true" ]]; then
          spelling="$(grep -E "${SPELLING_PATHS}" <<<"${changed}" || true)"
          if [[ -n "${spelling}" ]]; then
            echo "✂️ Not affecting ${TARGET} with spelling files:"
            sed 's/^/  /' <<<"${spelling}"
          fi
          changed="$(grep -Ev "${SPELLING_PATHS}" <<<"${changed}" || true)"
        fi

        read -ra arguments <<<"${ARGUMENTS}"
        printf '%s\n' "${changed}" \
          | pnpm exec nx affected --stdin --target="${TARGET}" "${arguments[@]}"
      shell: bash
